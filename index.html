<body>
<div class="app-shell" id="app"></div>
<div id="sheetRoot" class="sheet-backdrop" aria-hidden="true"></div>
<input id="importFile" type="file" accept="application/json" hidden>
<script>
(()=>{
'use strict';

const DB_KEY='production-projects-v1';
const SCHEMA_VERSION=4;
const LEGACY_KEYS=['smithereens-map-v6','smithereens-map-v5','smithereens-map-v2'];
const FEEL_SCALES={depth:['Close','Mixed','Distant'],space:['Dry','Mixed','Wet'],width:['Narrow','Mixed','Wide'],density:['Sparse','Balanced','Dense'],energy:['Low','Medium','High']};
const FEEL_LABELS={depth:'Depth',space:'Space',width:'Width',density:'Density',energy:'Energy'};
const SECTION_TYPES=['Intro','Verse','Pre-Chorus','Chorus','Bridge','Instrumental','Outro'];
const COMMON_TRACKS=['Vocal','Drums','Bass','Ukulele','Guitar','Piano','Synth','Backing vocals','Percussion','FX'];
const CHANGE_DEFS={
  Widens:{group:'space',groupLabel:'Space',property:'width',kind:'range',tone:'space'},
  Narrows:{group:'space',groupLabel:'Space',property:'width',kind:'range',tone:'space'},
  Louder:{group:'level',groupLabel:'Level',property:'level',kind:'range',tone:'level'},
  Softer:{group:'level',groupLabel:'Level',property:'level',kind:'range',tone:'level'},
  Doubles:{group:'performance',groupLabel:'Performance',property:'doubling',kind:'range',tone:'performance'},
  'Pattern shift':{group:'performance',groupLabel:'Performance',property:'pattern',kind:'marker',tone:'performance'},
  'Register shift':{group:'performance',groupLabel:'Performance',property:'register',kind:'marker',tone:'performance'},
  'Effect shift':{group:'sound',groupLabel:'Sound',property:'effect',kind:'range',tone:'sound'},
  'Transition cue':{group:'cue',groupLabel:'Cue',property:'cue',kind:'marker',tone:'cue'}
};
const CHANGE_GROUPS=[
  {key:'space',label:'Space'},
  {key:'level',label:'Level'},
  {key:'performance',label:'Performance'},
  {key:'sound',label:'Sound'},
  {key:'cue',label:'Cue'}
];
const STUDY_PHASES=[
  {key:'map',title:'The Map',desc:'Understand the song before rebuilding it.',route:'map',checkpoints:['Structure','Tracks','Section Study']},
  {key:'skeleton',title:'The Skeleton',desc:'Build the complete draft.',route:'skeleton',checkpoints:['Session','Draft','Bounce']},
  {key:'sounds',title:'The Sounds',desc:'Match sounds and performances.',route:'roadmap',checkpoints:['Sources','Performance','Character']},
  {key:'balance',title:'The Balance',desc:'Set levels, pan, and hierarchy.',route:'roadmap',checkpoints:['Levels','Pan','Hierarchy']},
  {key:'shape',title:'The Shape',desc:'Shape tone and dynamics.',route:'roadmap',checkpoints:['Frequency','Dynamics','Character']},
  {key:'world',title:'The World',desc:'Create depth, width, and movement.',route:'roadmap',checkpoints:['Depth','Width','Movement']},
  {key:'finish',title:'The Finish',desc:'Compare, revise, finish.',route:'roadmap',checkpoints:['A/B','Revise','Deliver']}
];
const ORIGINAL_PHASES=[['The Spark','Capture the thing worth making.'],['The Direction','Decide where the idea wants to go.'],['The Skeleton','Build a rough song from beginning to end.'],['The Production','Develop arrangement, transitions, and identity.'],['The Recording','Replace placeholders with intentional performances.'],['The Mix','Balance, shape, and place the record.'],['The Finish','Reference, revise, and commit.']];

const app=document.getElementById('app');
const sheetRoot=document.getElementById('sheetRoot');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clean=s=>String(s??'').trim();
const uid=()=>crypto?.randomUUID?.()||('id-'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const clamp=(n,min,max)=>Math.min(max,Math.max(min,n));
function changeMeta(label){return CHANGE_DEFS[label]||{group:'other',groupLabel:'Other',property:'custom:'+String(label||'change').toLowerCase(),kind:'range',tone:'other'}}
function eventTone(e){return e?.tone||changeMeta(e?.label).tone||'other'}
function eventColorVar(e){return `var(--change-${eventTone(e)})`}
let saveFlashTimer=null;
let sheetClearTimer=null;
let ui={route:'projects',sectionIndex:0,newType:'original',expandedTrackId:null,animating:false};

function makeSectionData(){return {feel:{depth:null,space:null,width:null,density:null,energy:null},focusIds:[],focusState:'',silence:false,parking:'',takeaway:''}}
function makeStudyProject(title='Smithereens',artist='Twenty One Pilots'){
  return {id:uid(),type:'study',title,artist,createdAt:Date.now(),schemaVersion:SCHEMA_VERSION,map:{setup:{reference:false,tempo:'',meter:'4/4',grid:false,firstListen:false},sections:[],structureVerified:false,tracks:[],timeline:{presence:[],events:[]},sectionData:{},mapVerified:false,teachBack:false,phaseParking:'',phaseTakeaway:''},skeleton:{session:{tracks:{},markers:{}},draft:{parts:{}},bounce:{exported:false,listened:false}},notes:[]};
}
function makeOriginalProject(title='Untitled'){return {id:uid(),type:'original',title:title||'Untitled',createdAt:Date.now(),schemaVersion:SCHEMA_VERSION,spark:{starts:[],idea:'',reasons:[],anchor:''},notes:[]}}
function seedDB(){const p=makeStudyProject();p.id='smithereens';return {version:SCHEMA_VERSION,currentProjectId:p.id,projects:[p]}}

function migrateLegacyStorage(){
  for(const key of LEGACY_KEYS){
    try{
      const old=JSON.parse(localStorage.getItem(key));if(!old)continue;
      const p=makeStudyProject();p.id='smithereens';
      p.map.setup={reference:!!old.setup?.reference,tempo:old.setup?.tempo||'',meter:old.setup?.meter||'4/4',grid:!!(old.setup?.grid??old.setup?.alignment),firstListen:!!(old.setup?.firstListen??old.setup?.listen)};
      p.map.sections=(old.sections||[]).map((s,i)=>typeof s==='string'?{id:'legacy-'+i+'-'+uid(),name:s,lengthBars:null}:{id:s.id||uid(),name:s.name||'Section',lengthBars:s.lengthBars||null});
      p.map.structureVerified=!!(old.structureVerified??old.transitionsChecked);
      p.map.ingredients=[...(old.ingredients||old.parts||[])];
      p.map.unknowns=[...(old.unknowns||[])];
      p.map.analysis=old.analysis||old.sectionAnalysis||{};
      p.map.transitions=old.transitions||{};
      p.map.phaseParking=old.phaseParking||old.parkingLot||'';p.map.phaseTakeaway=old.phaseTakeaway||old.babelTakeaway||'';p.map.mapVerified=!!old.mapVerified;p.map.teachBack=!!old.teachBack;
      return {version:1,currentProjectId:p.id,projects:[p]};
    }catch(e){}
  }
  return null;
}
function loadDB(){try{const saved=JSON.parse(localStorage.getItem(DB_KEY));if(saved?.projects?.length)return saved}catch(e){}return migrateLegacyStorage()||seedDB()}
let db=loadDB();

function normalizeDatabase(candidate){
  const out=candidate&&Array.isArray(candidate.projects)?candidate:seedDB();
  out.version=SCHEMA_VERSION;
  out.projects.forEach(p=>{
    p.schemaVersion=SCHEMA_VERSION;
    if(p.type==='original'){
      p.spark=p.spark||{starts:[],idea:'',reasons:[],anchor:''};p.spark.starts=p.spark.starts||[];p.spark.reasons=p.spark.reasons||[];p.spark.idea=p.spark.idea||'';p.spark.anchor=p.spark.anchor||'';p.notes=p.notes||[];return;
    }
    p.type='study';p.map=p.map||{};const m=p.map;
    m.setup=m.setup||{reference:false,tempo:'',meter:'4/4',grid:false,firstListen:false};
    m.sections=(m.sections||[]).map((s,i)=>typeof s==='string'?{id:uid(),name:s,lengthBars:null}:{id:s.id||uid(),name:s.name||`Section ${i+1}`,lengthBars:validBars(s.lengthBars)?Number(s.lengthBars):null});
    const oldAnalysis=m.analysis||{};const oldTransitions=m.transitions||{};
    let tracks=Array.isArray(m.tracks)?m.tracks.filter(Boolean).map(t=>typeof t==='string'?{id:uid(),name:t}:{id:t.id||uid(),name:t.name||'Track'}):[];
    if(!tracks.length){
      const names=[...new Set([...(m.ingredients||[]),...(m.unknowns||[])].map(clean).filter(Boolean))];
      tracks=names.map(name=>({id:uid(),name}));
    }
    const usedNames=new Set();tracks=tracks.filter(t=>{const k=t.name.toLowerCase();if(!t.name||usedNames.has(k))return false;usedNames.add(k);return true});m.tracks=tracks;
    const nameToId=new Map(tracks.map(t=>[t.name,t.id]));
    m.sectionData=m.sectionData||{};
    m.sections.forEach(s=>{
      const existing=m.sectionData[s.id]||{};const old=oldAnalysis[s.id]||{};
      m.sectionData[s.id]={feel:{...makeSectionData().feel,...(old.feel||{}),...(existing.feel||{})},focusIds:Array.isArray(existing.focusIds)?existing.focusIds.filter(id=>tracks.some(t=>t.id===id)):(old.focus||[]).map(x=>nameToId.get(x)).filter(Boolean),focusState:existing.focusState||old.focusState||'',silence:existing.silence??(old.partsStatus==='silence'),parking:existing.parking??old.parking??'',takeaway:existing.takeaway??old.takeaway??''};
      if(m.sectionData[s.id].focusState==='unsure')m.sectionData[s.id].focusState='';
    });
    Object.keys(m.sectionData).forEach(id=>{if(!m.sections.some(s=>s.id===id))delete m.sectionData[id]});
    m.timeline=m.timeline||{presence:[],events:[]};m.timeline.presence=Array.isArray(m.timeline.presence)?m.timeline.presence:[];m.timeline.events=Array.isArray(m.timeline.events)?m.timeline.events:[];
    if(!m.timeline.presence.length&&Object.keys(oldAnalysis).length){
      tracks.forEach(track=>{
        let runStart=-1;
        for(let i=0;i<=m.sections.length;i++){
          const active=i<m.sections.length&&(oldAnalysis[m.sections[i].id]?.parts||[]).includes(track.name);
          if(active&&runStart<0)runStart=i;
          if((!active||i===m.sections.length)&&runStart>=0){const endIndex=i-1;m.timeline.presence.push({id:uid(),trackId:track.id,start:{sectionId:m.sections[runStart].id,bar:0},end:{sectionId:m.sections[endIndex].id,bar:'end'}});runStart=-1}
        }
      });
    }
    if(!m.timeline.events.length&&Object.keys(oldTransitions).length){
      for(let i=1;i<m.sections.length;i++){
        const prev=m.sections[i-1],cur=m.sections[i];const t=oldTransitions[`${prev.id}→${cur.id}`];
        (t?.changes||[]).forEach(c=>{if(c.action==='Enters'||c.action==='Leaves')return;const trackId=nameToId.get(c.target);m.timeline.events.push({id:uid(),targetType:trackId?'track':'mix',targetId:trackId||null,label:trackId?c.action:`${c.target} · ${c.action}`,kind:'marker',point:{sectionId:cur.id,bar:0}})});
      }
    }
    m.timeline.presence=m.timeline.presence.filter(r=>tracks.some(t=>t.id===r.trackId)&&anchorSectionExists(m,r.start)&&(r.end==null||anchorSectionExists(m,r.end))).map(r=>({id:r.id||uid(),trackId:r.trackId,start:normalizeAnchor(m,r.start,'start'),end:r.end==null?null:normalizeAnchor(m,r.end,'end')}));
    m.timeline.events=m.timeline.events.filter(e=>e&&e.kind&&((e.kind==='marker'&&anchorSectionExists(m,e.point))||(e.kind==='range'&&anchorSectionExists(m,e.start)&&(e.end==null||anchorSectionExists(m,e.end))))).map(e=>{const label=e.label||e.action||'Change',meta=changeMeta(label);return {id:e.id||uid(),targetType:e.targetType==='mix'?'mix':'track',targetId:e.targetType==='mix'?null:e.targetId,label,kind:e.kind||meta.kind,group:e.group||meta.group,property:e.property||meta.property,tone:e.tone||meta.tone,point:e.kind==='marker'?normalizeAnchor(m,e.point,'start'):undefined,start:e.kind==='range'?normalizeAnchor(m,e.start,'start'):undefined,end:e.kind==='range'?(e.end==null?null:normalizeAnchor(m,e.end,'end')):undefined}});
    m.structureVerified=!!m.structureVerified;m.mapVerified=!!m.mapVerified;m.teachBack=!!m.teachBack;m.phaseParking=m.phaseParking||'';m.phaseTakeaway=m.phaseTakeaway||'';
    if(!m.sections.every(s=>validBars(s.lengthBars))){m.structureVerified=false;m.mapVerified=false;m.teachBack=false}
    const oldSkeleton=p.skeleton||{};const oldSession=oldSkeleton.session||{};const oldDraft=oldSkeleton.draft||{};const oldRough=oldSkeleton.rough||{};
    const sessionTracks={};tracks.forEach(t=>sessionTracks[t.id]=!!(oldSession.tracks?.[t.id]??oldSession.tracks?.[t.name]));
    let markers={};if(typeof oldSession.markers==='boolean'){if(oldSession.markers)m.sections.forEach(s=>markers[s.id]=true)}else markers={...(oldSession.markers||{})};
    const draftParts={};m.sections.forEach(s=>{draftParts[s.id]={};const legacy=oldDraft.parts?.[s.id]||oldRough.parts?.[s.id]||{};tracks.forEach(t=>draftParts[s.id][t.id]=!!(legacy[t.id]??legacy[t.name]))});
    p.skeleton={session:{tracks:sessionTracks,markers},draft:{parts:draftParts},bounce:{exported:!!(oldSkeleton.bounce?.exported??oldRough.bounce),listened:!!oldSkeleton.bounce?.listened}};
    delete m.ingredients;delete m.unknowns;delete m.analysis;delete m.transitions;delete p.guidance;p.notes=p.notes||[];
    if(lengthsComplete(p))tracks.forEach(t=>mergePresenceForTrack(p,t.id,false));
  });
  if(!out.currentProjectId||!out.projects.some(p=>p.id===out.currentProjectId))out.currentProjectId=out.projects[0]?.id||null;
  return out;
}
function validBars(v){const n=Number(v);return Number.isFinite(n)&&n>=1&&n<=256&&Math.floor(n)===n}
function anchorSectionExists(m,a){return !!a&&m.sections.some(s=>s.id===a.sectionId)}
function normalizeAnchor(m,a,edge){const s=m.sections.find(x=>x.id===a?.sectionId)||m.sections[0];if(!s)return {sectionId:'',bar:0};if(a?.bar==='end')return {sectionId:s.id,bar:'end'};const n=Number(a?.bar);return {sectionId:s.id,bar:Number.isFinite(n)?Math.max(0,n):(edge==='end'?'end':0)}}
function persist(){try{localStorage.setItem(DB_KEY,JSON.stringify(db))}catch(e){}}
db=normalizeDatabase(db);persist();

function save(){persist();clearTimeout(saveFlashTimer);document.querySelectorAll('.saved').forEach(el=>el.classList.add('show'));saveFlashTimer=setTimeout(()=>document.querySelectorAll('.saved').forEach(el=>el.classList.remove('show')),650)}
function project(){return db.projects.find(p=>p.id===db.currentProjectId)||db.projects[0]}
function routeLabel(route){const labels={projects:'Projects',project:project()?.type==='study'?'Recreation':'Original Song',map:'The Map',structure:'Structure',tracks:'Tracks','section-study':'Section Study','map-summary':'Review Map',skeleton:'The Skeleton','skeleton-session':'Session','skeleton-draft':'Draft','draft-section':'Draft','skeleton-bounce':'Bounce',roadmap:'Roadmap',notes:'Notes','original-spark':'Original Song'};return labels[route]||'Back'}
function go(route,extra={},push=true){const fromRoute=ui.route,fromLabel=routeLabel(fromRoute);ui={...ui,...extra,route};const state={route,...extra,fromRoute,fromLabel,projectId:db.currentProjectId};if(push){try{history.pushState(state,'',location.pathname+location.search)}catch(e){}}else{try{history.replaceState(state,'',location.pathname+location.search)}catch(e){}}render();window.scrollTo(0,0)}
window.addEventListener('popstate',e=>{const st=e.state||{};if(st.projectId&&db.projects.some(p=>p.id===st.projectId))db.currentProjectId=st.projectId;ui={...ui,...st,route:st.route||'projects',animating:false};render();window.scrollTo(0,0)});
function initHistory(){const st=history.state;if(!st?.route){history.replaceState({route:'projects',projectId:db.currentProjectId,fromRoute:null,fromLabel:null},'',location.pathname+location.search)}else{ui={...ui,...st,route:st.route};if(st.projectId&&db.projects.some(p=>p.id===st.projectId))db.currentProjectId=st.projectId}}
function backButton(target='project',label='Back'){return `<button class="nav-btn left" data-action="go" data-route="${target}"><span class="arrow">‹</span>${esc(label)}</button>`}
function historyBackButton(fallbackRoute='project',fallbackLabel='Back'){const state=history.state||{},label=state.fromLabel||fallbackLabel;return `<button class="nav-btn left" data-action="history-back" data-fallback-route="${fallbackRoute}"><span class="arrow">‹</span>${esc(label)}</button>`}
function topbar(left='',center='',right=''){return `<div class="topbar"><div class="left">${left}</div><div class="center">${center}</div><div class="right">${right}</div></div>`}
function savedMark(){return `<span class="saved">Saved</span>`}
function phaseTag(text){return `<span class="pill-tag">${esc(text)}</span>`}
function phasePill(index){const ph=STUDY_PHASES[index];return `<button class="phase-pill" data-action="phase-nav" data-phase-index="${index}" aria-label="Open roadmap">${esc(ph.title)}</button>`}
function progressBar(done,total){const pct=total?Math.round(done/total*100):0;return `<div class="progress"><span style="width:${pct}%"></span></div><div class="progress-meta"><span>${done} of ${total}</span></div>`}

function sections(p=project()){return p?.map?.sections||[]}
function tracks(p=project()){return p?.map?.tracks||[]}
function trackById(p,id){return tracks(p).find(t=>t.id===id)}
function sectionIndexById(p,id){return sections(p).findIndex(s=>s.id===id)}

function sectionStarts(p){let sum=0;return sections(p).map(s=>{const start=sum;sum+=Number(s.lengthBars)||0;return start})}

function localSegmentsForRange(p,obj){if(!lengthsComplete(p))return [obj];const a=rangeAbs(p,obj),starts=sectionStarts(p),out=[];sections(p).forEach((sec,i)=>{const secStart=starts[i],secEnd=secStart+Number(sec.lengthBars),start=Math.max(a.start,secStart),end=Math.min(a.end,secEnd);if(end<=start+1e-6)return;const startAnchor={sectionId:sec.id,bar:start<=secStart+1e-6?0:start-secStart};const endAnchor={sectionId:sec.id,bar:end>=secEnd-1e-6?'end':end-secStart};out.push({start:startAnchor,end:endAnchor})});return out}

function mergeEventRanges(p){if(!lengthsComplete(p))return;const markers=p.map.timeline.events.filter(e=>e.kind!=='range'),ranges=p.map.timeline.events.filter(e=>e.kind==='range'),groups=new Map();ranges.forEach(e=>{const key=[e.targetType,e.targetId||'',e.label].join('|');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(e)});const merged=[];groups.forEach(items=>{items.sort((a,b)=>anchorAbs(p,a.start)-anchorAbs(p,b.start));items.forEach(e=>{const a=rangeAbs(p,e),last=merged.length?merged[merged.length-1]:null;if(last&&last.__key===[e.targetType,e.targetId||'',e.label].join('|')){const z=rangeAbs(p,last);if(a.start<=z.end+1e-6){if(last.end==null||e.end==null)last.end=null;else if(a.end>z.end)last.end=e.end;return}}merged.push({...e,__key:[e.targetType,e.targetId||'',e.label].join('|')})})});p.map.timeline.events=[...markers,...merged.map(({__key,...e})=>e)]}

function markerPortion(p,e,index){if(!lengthsComplete(p))return null;const starts=sectionStarts(p),s=sections(p)[index],secStart=starts[index],secEnd=secStart+Number(s.lengthBars),point=anchorAbs(p,e.point);if(point<secStart-1e-6||point>=secEnd-1e-6)return null;return {left:(point-secStart)/Number(s.lengthBars)*100,abs:point}}

function visiblePresence(p,trackId,index){return presenceForTrack(p,trackId).map(r=>({range:r,portion:rangePortion(p,r,index)})).filter(x=>x.portion)}
function trackIdsInSection(p,index){return tracks(p).filter(t=>visiblePresence(p,t.id,index).length).map(t=>t.id)}
function eventsForTarget(p,targetType,targetId){return p.map.timeline.events.filter(e=>e.targetType===targetType&&(targetType==='mix'||e.targetId===targetId))}
function visibleEvents(p,targetType,targetId,index){return eventsForTarget(p,targetType,targetId).map(e=>({event:e,portion:e.kind==='range'?rangePortion(p,e,index):markerPortion(p,e,index)})).filter(x=>x.portion)}
function trackUsedAnywhere(p,trackId){return presenceForTrack(p,trackId).length>0}
function focusName(p,id){return trackById(p,id)?.name||''}
function feelComplete(d){return Object.keys(FEEL_SCALES).every(k=>!!d.feel?.[k])}
function sectionComplete(p,index){const s=sections(p)[index];if(!s||!validBars(s.lengthBars))return false;const d=sectionData(p,s.id),present=trackIdsInSection(p,index);const presenceDone=present.length>0||d.silence;const focusDone=d.focusState==='none'||(d.focusState==='selected'&&d.focusIds.length>0);return presenceDone&&feelComplete(d)&&focusDone}

function tracksDone(p){return tracks(p).length>0}
function tracksUsedDone(p){return tracks(p).length>0&&tracks(p).every(t=>trackUsedAnywhere(p,t.id))}
function sectionStudyCoreDone(p){return sections(p).length>0&&sections(p).every((_,i)=>sectionComplete(p,i))}

function sessionDone(p){return tracks(p).length>0&&sections(p).length>0&&tracks(p).every(t=>p.skeleton.session.tracks[t.id])&&sections(p).every(s=>p.skeleton.session.markers[s.id])}

function studyPhaseStatus(p,i){if(studyPhaseDone(p,i))return'done';if(currentStudyPhaseIndex(p)===i)return'current';return'future'}
function originalSparkDone(p){return !!(p.spark?.idea?.trim()||p.spark?.starts?.length)&&!!(p.spark?.anchor?.trim()||p.spark?.reasons?.length)}

function invalidateMapVerification(p){p.map.mapVerified=false;p.map.teachBack=false}
function invalidateBounce(p){p.skeleton.bounce.exported=false;p.skeleton.bounce.listened=false}

function render(){
  switch(ui.route){
    case'projects':return renderProjects();case'new-project':return renderNewProject();case'roadmap':return renderRoadmap();case'notes':return renderNotes();case'map':return renderMapHome();case'structure':return renderStructure();case'tracks':return renderTracks();case'section-study':return renderSectionStudy();case'map-summary':return renderMapSummary();case'skeleton':return renderSkeletonHome();case'skeleton-session':return renderSkeletonSession();case'skeleton-draft':return renderSkeletonDraft();case'draft-section':return renderDraftSection();case'skeleton-bounce':return renderSkeletonBounce();case'original-spark':return renderOriginalSpark();default:return renderProject();

function renderProjects(){app.innerHTML=topbar('',phaseTag('FIRE'),`<button class="top-icon-btn" data-action="new-project" aria-label="New project">+</button>`)+`<h1>Projects</h1><p class="sub">Original songs and recreations.</p><div class="spacer-24"></div>${db.projects.length?db.projects.map(p=>{const phase=p.type==='study'?STUDY_PHASES[currentStudyPhaseIndex(p)].title:(originalSparkDone(p)?'The Direction':'The Spark');return `<div class="project-card"><button class="project-open" data-action="open-project" data-id="${p.id}"><div class="type">${p.type==='study'?'Recreation':'Original Song'}</div><strong>${esc(p.title)}</strong>${p.artist?`<div class="artist">${esc(p.artist)}</div>`:''}<div class="foot"><span>${esc(phase)}</span><span>Open ›</span></div></button><button class="project-menu" data-action="project-menu" data-id="${p.id}" aria-label="Project options">•••</button></div>`}).join(''):`<div class="empty">No projects yet. Tap + to start one.</div>`}`}

function renderMapHome(){const p=project(),m=p.map,done=mapCheckpointCount(p),setupDone=mapSetupComplete(p),structureUnlocked=setupDone||structureDone(p),tracksUnlocked=structureDone(p)||tracksDone(p)||sectionStudyCoreDone(p),studyUnlocked=(structureDone(p)&&tracksDone(p))||sectionStudyCoreDone(p),studyRoute=sectionStudyCoreDone(p)?'map-summary':'section-study';const setup=`<div class="section-kicker">Song Setup</div><div class="group-card setup-panel"><div class="setup-row"><div class="setup-label">Reference</div><button class="state-control ${m.setup.reference?'on':''}" data-action="toggle-setup" data-field="reference"><span>${m.setup.reference?'Imported':'Import'}</span><span class="check-circle"></span></button></div><div class="setup-row"><div class="setup-label">Tempo</div><div class="setup-value"><input id="tempoInput" inputmode="numeric" value="${esc(m.setup.tempo)}" placeholder="—"><span class="suffix">BPM</span></div></div><div class="setup-row"><div class="setup-label">Meter</div><div class="setup-value"><select id="meterInput">${['4/4','3/4','6/8','5/4','7/8'].map(x=>`<option ${m.setup.meter===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="setup-row"><div class="setup-label">Grid</div><button class="state-control ${m.setup.grid?'on':''}" data-action="toggle-setup" data-field="grid"><span>${m.setup.grid?'Aligned':'Align'}</span><span class="check-circle"></span></button></div></div><div class="spacer-18"></div>${actionCard('First Listen','Play the full song once without stopping.',m.setup.firstListen,'toggle-setup',false,'data-field="firstListen"')}`;const checkpoints=checkpointRow('Structure','Map the form.','structure',structureDone(p),structureUnlocked)+checkpointRow('Tracks','Identify what plays.','tracks',tracksDone(p),tracksUnlocked)+checkpointRow('Section Study','Map each section in time.',studyRoute,sectionStudyDone(p),studyUnlocked);app.innerHTML=phaseHome(0,done,3,checkpoints,setup)}

function renderStructure(){const p=project(),labels=sectionLabels(p),done=structureDone(p);app.innerHTML=topbar(historyBackButton('map','The Map'),phasePill(0),savedMark())+`<h2>Map the form</h2><p class="sub">Build the song one section at a time.</p><div class="section-kicker">Structure</div><div class="structure-list" id="sortList">${sections(p).length?sections(p).map((s,i)=>`<div class="structure-row sort-row" data-action="edit-section" data-section-id="${s.id}"><div class="index">${i+1}</div><div class="name">${esc(labels[i])}</div><span class="bars-badge">${s.lengthBars} bars</span><div class="drag-handle" data-drag-handle aria-label="Reorder ${esc(labels[i])}">≡</div></div>`).join(''):`<div class="empty">No sections yet.</div>`}</div><button class="add-section-row" data-action="open-add-section">+ Add section</button><div class="section-kicker">Verify</div>${actionCard('Verify structure','Confirm the order, lengths, and boundaries.',p.map.structureVerified,'toggle-structure-verified',!lengthsComplete(p))}<div class="spacer-24"></div><button class="primary full" data-action="go" data-route="tracks" ${done?'':'disabled'}>Next</button>`;installSorting()}
function renderTracks(){const p=project(),selectedNames=new Set(tracks(p).map(t=>t.name)),custom=tracks(p).filter(t=>!COMMON_TRACKS.includes(t.name)),choices=[...COMMON_TRACKS,...custom.map(t=>t.name)];app.innerHTML=topbar(historyBackButton('map','The Map'),phasePill(0),savedMark())+`<h2>Identify the tracks</h2><p class="sub">Select everything that appears somewhere in the song.</p><div class="section-kicker">Tracks</div><div class="choice-wrap">${choices.map(name=>`<button class="choice ${selectedNames.has(name)?'selected':''}" data-action="toggle-track-choice" data-name="${esc(name)}">${esc(name)}</button>`).join('')}</div><div class="inline-add"><input class="field" id="customTrack" placeholder="Other..."><button class="secondary" data-action="add-custom-track">Add</button></div><div class="spacer-24"></div><button class="primary full" data-action="start-section-study" ${tracksDone(p)?'':'disabled'}>Next</button>`}

function rulerHtml(bars){const step=bars<=12?1:bars<=24?2:4,labels=[];for(let i=0;i<bars;i+=step)labels.push(`<span class="ruler-label ${i===0?'first':''}" style="left:${i/bars*100}%">${i+1}</span>`);return labels.join('')}
function timingSummary(p,trackId,index){const pieces=visiblePresence(p,trackId,index);if(!pieces.length)return'Not present';const len=Number(sections(p)[index].lengthBars),x=pieces[0].portion;const startBar=Math.floor((x.left/100)*len)+1,endBar=Math.round(((100-x.right)/100)*len);if(pieces.length>1)return`${pieces.length} ranges`;if(x.continuesIn&&x.continuesOut)return'Continues through';if(x.left<.01&&x.right<.01)return'Full section';if(x.continuesIn)return`Continues · through bar ${endBar}`;if(x.continuesOut)return`Starts bar ${startBar} · continues`;return startBar===endBar?`Bar ${startBar}`:`Bars ${startBar}–${endBar}`}
function presenceSegmentHtml(p,item,index,expanded){const {range,portion:x}=item;return `<div class="presence-segment ${x.continuesIn?'continue-in':''} ${x.continuesOut?'continue-out':''} ${!x.continuesIn&&x.startHere?'start-cap':''} ${!x.continuesOut&&x.endHere?'end-cap':''}" data-action="edit-presence" data-range-id="${range.id}" style="left:${x.left}%;right:${x.right}%">${expanded&&!x.continuesIn&&x.startHere?`<span class="presence-handle left" data-presence-handle data-range-id="${range.id}" data-edge="start"></span>`:''}${expanded&&!x.continuesOut&&x.endHere?`<span class="presence-handle right" data-presence-handle data-range-id="${range.id}" data-edge="end"></span>`:''}</div>`}
function compactEventsHtml(p,targetType,targetId,index){return visibleEvents(p,targetType,targetId,index).map(({event:e,portion:x})=>e.kind==='range'?`<span class="event-summary-range tone-${eventTone(e)}" style="left:${x.left}%;right:${x.right}%"></span>`:`<span class="event-summary-marker tone-${eventTone(e)}" style="left:${x.left}%"></span>`).join('')}
function eventDetailRows(p,targetType,targetId,index){const bars=Number(sections(p)[index].lengthBars),vis=visibleEvents(p,targetType,targetId,index);if(!vis.length)return'';return `<div class="change-stack">${vis.map(({event:e,portion:x})=>e.kind==='range'?`<div class="change-row"><div class="change-name">${esc(e.label)}</div><div class="change-lane" style="--bars:${bars};--event-color:${eventColorVar(e)}"><div class="change-range ${x.continuesIn?'continue-in':''} ${x.continuesOut?'continue-out':''}" data-action="edit-event" data-event-id="${e.id}" style="left:${x.left}%;right:${x.right}%">${!x.continuesIn&&x.startHere?`<span class="event-handle left" data-event-handle data-event-id="${e.id}" data-edge="start"></span>`:''}${!x.continuesOut&&x.endHere?`<span class="event-handle right" data-event-handle data-event-id="${e.id}" data-edge="end"></span>`:''}</div></div></div>`:`<div class="change-row"><div class="change-name">${esc(e.label)}</div><div class="change-lane" style="--bars:${bars};--event-color:${eventColorVar(e)}"><button class="change-marker" data-action="edit-event" data-event-marker data-event-id="${e.id}" style="left:${x.left}%" aria-label="Edit ${esc(e.label)}"></button></div></div>`).join('')}</div>`}
function trackDetailHtml(p,track,index){const ranges=visiblePresence(p,track.id,index),hasGap=!!presenceGapInSection(p,track.id,index),openRange=ranges.find(x=>x.range.end==null||x.portion.continuesOut);return `<div class="track-detail">${eventDetailRows(p,'track',track.id,index)}<div class="track-detail-actions"><button class="mini-btn primary-mini" data-action="open-add-change" data-target-type="track" data-target-id="${track.id}">+ Change</button>${openRange?`<button class="mini-btn" data-action="cut-presence" data-range-id="${openRange.range.id}">Cut</button>`:''}${hasGap?`<button class="mini-btn" data-action="add-another-presence" data-track-id="${track.id}">+ Presence</button>`:''}</div></div>`}
function timelineTrackRow(p,track,index){const bars=Number(sections(p)[index].lengthBars),ranges=visiblePresence(p,track.id,index),expanded=ui.expandedTrackId===track.id,absent=!ranges.length;return `<div class="timeline-row ${expanded?'expanded':''} ${absent?'absent':''}"><button class="timeline-label ${expanded?'expanded':''}" data-action="toggle-timeline-track" data-track-id="${track.id}"><strong>${esc(track.name)}</strong></button><div class="timeline-lane" style="--bars:${bars}">${ranges.map(item=>presenceSegmentHtml(p,item,index,expanded)).join('')}${compactEventsHtml(p,'track',track.id,index)}${absent?`<button class="timeline-add" data-action="add-presence-section" data-track-id="${track.id}" aria-label="Add ${esc(track.name)}">+</button>`:''}</div>${expanded&&ranges.length?trackDetailHtml(p,track,index):''}</div>`}
function mixTimelineRow(p,index){const bars=Number(sections(p)[index].lengthBars),events=visibleEvents(p,'mix',null,index),expanded=ui.expandedTrackId==='__mix__';return `<div class="timeline-row mix-row ${expanded?'expanded':''}"><button class="timeline-label ${expanded?'expanded':''}" data-action="toggle-timeline-track" data-track-id="__mix__"><strong>Mix</strong></button><div class="timeline-lane" style="--bars:${bars}">${compactEventsHtml(p,'mix',null,index)}</div>${expanded?`<div class="track-detail">${eventDetailRows(p,'mix',null,index)}<div class="track-detail-actions"><button class="mini-btn primary-mini" data-action="open-add-change" data-target-type="mix">+ Change</button></div></div>`:''}</div>`}
function sectionStudyPaneHtml(p,index){const s=sections(p)[index],labels=sectionLabels(p),d=sectionData(p,s.id),presentIds=trackIdsInSection(p,index),focusOptions=presentIds.map(id=>trackById(p,id)).filter(Boolean),done=sectionComplete(p,index);return `<div class="study-pane"><h2>${esc(labels[index])}</h2><p class="sub">${s.lengthBars} bars</p><div class="timeline-card"><div class="timeline-head"><strong>Arrangement</strong></div><div class="timeline-ruler">${rulerHtml(Number(s.lengthBars))}</div>${tracks(p).map(t=>timelineTrackRow(p,t,index)).join('')}${mixTimelineRow(p,index)}</div>${!presentIds.length?`<div class="spacer-12"></div><button class="choice quiet ${d.silence?'selected':''}" data-action="toggle-section-silence">No active tracks</button>`:''}<div class="study-block"><div class="block-head"><strong>Feel</strong></div><div class="segment-stack">${Object.keys(FEEL_SCALES).map(k=>renderScale(k,d)).join('')}</div></div><div class="study-block"><div class="block-head"><strong>Focus</strong></div><div class="choice-wrap">${focusOptions.map(t=>`<button class="choice ${d.focusIds.includes(t.id)?'selected':''}" data-action="toggle-focus" data-track-id="${t.id}">${esc(t.name)}</button>`).join('')}</div><div class="spacer-8"></div><button class="choice quiet ${d.focusState==='none'?'selected':''}" data-action="focus-none">No clear focus</button></div><details class="note-disclosure"><summary>Notes</summary><div class="note-grid"><div><label>Parking Lot</label><textarea class="textarea" data-input="section-parking" placeholder="Question or mystery for later">${esc(d.parking)}</textarea></div><div><label>Takeaway</label><textarea class="textarea" data-input="section-takeaway" placeholder="Something worth remembering">${esc(d.takeaway)}</textarea></div></div></details><div class="action-row"><button class="secondary" data-action="prev-section" ${index===0?'disabled':''}>Previous</button><button class="primary" data-action="next-section" ${done?'':'disabled'}>${index===sections(p).length-1?'Review Map':'Next'}</button></div></div>`}
function renderScale(key,d){const value=d.feel?.[key];return `<div class="scale-row"><div class="scale-label">${FEEL_LABELS[key]}</div><div class="segmented">${FEEL_SCALES[key].map(opt=>`<button class="segment ${value===opt?'selected':''}" data-action="set-feel" data-scale="${key}" data-value="${opt}">${opt}</button>`).join('')}</div></div>`}
function renderSectionStudy(){const p=project();if(!structureDone(p)||!tracksDone(p)){app.innerHTML=topbar(historyBackButton('map','The Map'),phasePill(0),savedMark())+`<h2>Section Study</h2><p class="sub">Finish Structure and Tracks first.</p>`;return}ui.sectionIndex=clamp(ui.sectionIndex,0,sections(p).length-1);const labels=sectionLabels(p);app.innerHTML=topbar(historyBackButton('map','The Map'),phasePill(0),`<span class="micro">${ui.sectionIndex+1} of ${sections(p).length}</span>`)+`<div class="horizontal-nav">${sections(p).map((s,i)=>{const unlocked=i===0||sections(p).slice(0,i).every((_,j)=>sectionComplete(p,j));return `<button class="section-tab ${i===ui.sectionIndex?'current':''} ${sectionComplete(p,i)?'done':''}" data-action="jump-section" data-index="${i}" ${unlocked?'':'disabled'}>${esc(labels[i])}</button>`}).join('')}</div><div class="spacer-12"></div><div class="study-viewport"><div class="study-single">${sectionStudyPaneHtml(p,ui.sectionIndex)}</div></div>`;installTimelineInteractions()}
function animateSectionTo(newIndex){const p=project();newIndex=clamp(newIndex,0,sections(p).length-1);if(newIndex===ui.sectionIndex||ui.animating)return;if(matchMedia('(prefers-reduced-motion: reduce)').matches){ui.sectionIndex=newIndex;ui.expandedTrackId=null;return renderSectionStudy()}const viewport=app.querySelector('.study-viewport'),current=viewport?.querySelector('.study-pane');if(!viewport||!current){ui.sectionIndex=newIndex;return renderSectionStudy()}ui.animating=true;const forward=newIndex>ui.sectionIndex,stage=document.createElement('div');stage.className='study-transition-stage';const incoming=document.createElement('div');incoming.innerHTML=sectionStudyPaneHtml(p,newIndex);const newPane=incoming.firstElementChild,oldPane=current.cloneNode(true);viewport.innerHTML='';if(forward){stage.append(oldPane,newPane);stage.style.transform='translateX(0)'}else{stage.append(newPane,oldPane);stage.style.transform='translateX(-50%)'}viewport.append(stage);requestAnimationFrame(()=>requestAnimationFrame(()=>stage.style.transform=forward?'translateX(-50%)':'translateX(0)'));setTimeout(()=>{ui.sectionIndex=newIndex;ui.expandedTrackId=null;ui.animating=false;renderSectionStudy()},360)}

function renderMapSummary(){const p=project(),labels=sectionLabels(p),unused=tracks(p).filter(t=>!trackUsedAnywhere(p,t.id));app.innerHTML=topbar(historyBackButton('map','The Map'),phasePill(0),savedMark())+`<h2>Review the map</h2><p class="sub">Listen once more and fix anything that doesn’t match.</p><div class="section-kicker">Structure</div><div class="chip-list">${sections(p).map((s,i)=>`<span class="chip">${esc(labels[i])} · ${s.lengthBars} bars</span>`).join('')}</div><div class="section-kicker">Tracks</div><div class="chip-list">${tracks(p).map(t=>`<span class="chip">${esc(t.name)}</span>`).join('')}</div>${unused.length?`<div class="spacer-18"></div><button class="warning-card" data-action="go" data-route="tracks" style="width:100%;text-align:left"><strong>Unused tracks</strong><p>${esc(unused.map(t=>t.name).join(' · '))} ${unused.length===1?'does':'do'} not appear in any section.</p></button>`:''}<div class="section-kicker">Sections</div><div class="group-card" style="padding:0 14px">${sections(p).map((s,i)=>renderSummaryCard(p,i,labels[i])).join('')}</div><details class="note-disclosure"><summary>Notes</summary><div class="note-grid"><div><label>Parking Lot</label><textarea class="textarea" data-input="phase-parking">${esc(p.map.phaseParking)}</textarea></div><div><label>Takeaway</label><textarea class="textarea" data-input="phase-takeaway">${esc(p.map.phaseTakeaway)}</textarea></div></div></details><div class="section-kicker">Verify</div>${actionCard('Map verified','Listen once more with the finished map.',p.map.mapVerified,'toggle-map-verified',!sectionStudyDone(p))}${actionCard('Teach it back','Explain the map in your own words.',p.map.teachBack,'toggle-teach-back',!p.map.mapVerified)}<div class="spacer-24"></div><button class="primary full" data-action="go" data-route="skeleton" ${mapDone(p)?'':'disabled'}>Continue to The Skeleton</button>`}
function renderSummaryCard(p,index,label){const s=sections(p)[index],d=sectionData(p,s.id),ids=trackIdsInSection(p,index),names=ids.map(id=>focusName(p,id)),eventCount=p.map.timeline.events.filter(e=>e.targetType==='mix'||ids.includes(e.targetId)).filter(e=>e.kind==='range'?rangePortion(p,e,index):markerPortion(p,e,index)).length,feel=Object.keys(FEEL_SCALES).map(k=>d.feel[k]).filter(Boolean).join(' · '),focus=d.focusState==='none'?'No clear focus':d.focusIds.map(id=>focusName(p,id)).filter(Boolean).join(' · ');return `<button class="summary-card" data-action="summary-jump" data-index="${index}"><div class="summary-title"><strong>${esc(label)}</strong><span>Edit ›</span></div><div class="summary-lines"><div class="summary-line"><b>Length</b><span>${s.lengthBars} bars</span></div><div class="summary-line"><b>Tracks</b><span>${d.silence?'No active tracks':esc(names.join(' · ')||'Not mapped')}</span></div><div class="summary-line"><b>Changes</b><span>${eventCount?`${eventCount} mapped`:'None mapped'}</span></div><div class="summary-line"><b>Feel</b><span>${esc(feel||'Not mapped')}</span></div><div class="summary-line"><b>Focus</b><span>${esc(focus||'Not mapped')}</span></div>${d.parking?`<div class="summary-line"><b>Parking Lot</b><span>${esc(d.parking)}</span></div>`:''}${d.takeaway?`<div class="summary-line"><b>Takeaway</b><span>${esc(d.takeaway)}</span></div>`:''}</div></button>`}

function renderSkeletonHome(){const p=project(),done=skeletonCheckpointCount(p),checkpoints=checkpointRow('Session','Create tracks and section markers.','skeleton-session',sessionDone(p),mapDone(p)||sessionDone(p))+checkpointRow('Draft','Build every mapped part end to end.','skeleton-draft',draftDone(p),sessionDone(p)||draftDone(p)||bounceDone(p))+checkpointRow('Bounce','Export and hear the complete draft.','skeleton-bounce',bounceDone(p),draftDone(p)||bounceDone(p));app.innerHTML=phaseHome(1,done,3,checkpoints)}
function renderSkeletonSession(){const p=project(),labels=sectionLabels(p);app.innerHTML=topbar(historyBackButton('skeleton','The Skeleton'),phasePill(1),savedMark())+`<h2>Set up the session</h2><p class="sub">Create the tracks and markers from The Map.</p><div class="section-kicker">Tracks</div><div class="group-card list">${tracks(p).map(t=>`<button class="list-row" data-action="toggle-session-track" data-track-id="${t.id}"><span class="round-check ${p.skeleton.session.tracks[t.id]?'on':''}"></span><div><div class="title">${esc(t.name)}</div><div class="desc">Placeholder track</div></div><span></span></button>`).join('')}</div><div class="section-kicker">Markers</div><div class="group-card list">${sections(p).map((s,i)=>`<button class="list-row" data-action="toggle-session-marker" data-section-id="${s.id}"><span class="round-check ${p.skeleton.session.markers[s.id]?'on':''}"></span><div><div class="title">${esc(labels[i])}</div><div class="desc">${s.lengthBars} bars</div></div><span></span></button>`).join('')}</div><div class="spacer-24"></div><button class="primary full" data-action="go" data-route="skeleton-draft" ${sessionDone(p)?'':'disabled'}>Next</button>`}
function renderSkeletonDraft(){const p=project(),labels=sectionLabels(p);app.innerHTML=topbar(historyBackButton('skeleton','The Skeleton'),phasePill(1),savedMark())+`<h2>Build the draft</h2><p class="sub">Complete each mapped part in the song.</p><div class="section-kicker">Sections</div><div class="group-card list">${sections(p).map((s,i)=>{const req=draftRequirements(p,i),state=p.skeleton.draft.parts[s.id]||{},count=req.filter(id=>state[id]).length,done=draftSectionDone(p,i);return `<button class="list-row draft-section-row" data-action="open-draft-section" data-index="${i}"><span class="round-check ${done?'on':''}"></span><div><div class="title">${esc(labels[i])}</div><div class="desc">${req.length?`${count} of ${req.length} tracks`:'No active tracks'}</div></div><span class="chev">›</span></button>`}).join('')}</div><div class="spacer-24"></div><button class="primary full" data-action="go" data-route="skeleton-bounce" ${draftDone(p)?'':'disabled'}>Next</button>`}
function relevantTrackEvents(p,trackId,index){return visibleEvents(p,'track',trackId,index).map(x=>x.event.label)}
function renderDraftSection(){const p=project(),index=clamp(ui.sectionIndex,0,sections(p).length-1),s=sections(p)[index],labels=sectionLabels(p),req=draftRequirements(p,index),state=p.skeleton.draft.parts[s.id]||{};app.innerHTML=topbar(historyBackButton('skeleton-draft','Draft'),phasePill(1),savedMark())+`<h2>${esc(labels[index])}</h2><p class="sub">Build the parts The Map says belong here.</p><div class="section-kicker">Tracks</div><div class="group-card list">${req.length?req.map(id=>{const t=trackById(p,id),events=relevantTrackEvents(p,id,index),summary=timingSummary(p,id,index);return `<button class="list-row" data-action="toggle-draft-part" data-track-id="${id}"><span class="round-check ${state[id]?'on':''}"></span><div><div class="title">${esc(t?.name||'Track')}</div><div class="desc">${esc(summary)}${events.length?` · ${esc(events.join(' · '))}`:''}</div></div><span></span></button>`}).join(''):`<div class="empty" style="padding:18px 14px">No active tracks in this section.</div>`}</div>`}
function renderSkeletonBounce(){const p=project();app.innerHTML=topbar(historyBackButton('skeleton','The Skeleton'),phasePill(1),savedMark())+`<h2>Bounce the draft</h2><p class="sub">Hear the complete arrangement as one song.</p><div class="section-kicker">Bounce</div>${actionCard('Export draft bounce','One beginning-to-end bounce.',p.skeleton.bounce.exported,'toggle-bounce-export')}${actionCard('Listen start to finish','Play the bounce once without stopping.',p.skeleton.bounce.listened,'toggle-bounce-listen',!p.skeleton.bounce.exported)}<div class="spacer-24"></div><button class="primary full" data-action="go" data-route="roadmap" ${skeletonDone(p)?'':'disabled'}>Next Phase</button>`}

function renderRoadmap(){const p=project();if(p.type==='original'){app.innerHTML=topbar(backButton('project','Original Song'),phaseTag('Roadmap'),'')+`<h2>Original Song</h2><p class="sub">Anything worth keeping → finished record.</p><div class="spacer-18"></div>${ORIGINAL_PHASES.map((ph,i)=>`<div class="road-phase ${i===0?'current':'future'}"><div class="road-top"><div class="road-num">${i+1}</div><div><h3>${esc(ph[0])}</h3><p>${esc(ph[1])}</p></div></div></div>`).join('')}`;return}app.innerHTML=topbar(backButton('project','Recreation'),phaseTag('Roadmap'),'')+`<h2>Recreation roadmap</h2><p class="sub">Seven phases from analysis to finished rebuild.</p><div class="spacer-18"></div>${STUDY_PHASES.map((ph,i)=>{const st=studyPhaseStatus(p,i),unlocked=studyPhaseUnlocked(p,i),tag=unlocked?'button':'div';return `<${tag} class="road-phase ${st} ${unlocked?'clickable':''}" ${unlocked?`data-action="go" data-route="${ph.route}"`:''}><div class="road-top">${st==='done'?`<span class="round-check on"></span>`:st==='current'?`<span class="current-ring"></span>`:`<div class="road-num">${i+1}</div>`}<div><h3>${esc(ph.title)}</h3><p>${esc(ph.desc)}</p></div>${unlocked?`<span class="chev">›</span>`:''}</div><div class="road-checks">${ph.checkpoints.map(x=>`<span class="road-check">${esc(x)}</span>`).join('')}</div></${tag}>`}).join('')}`}
function renderNotes(){const p=project();if(p.type==='original'){app.innerHTML=topbar(backButton('project','Original Song'),phaseTag('Notes'),'')+`<h2>Notes</h2><p class="sub">Keep project notes in one place.</p>`;return}const labels=sectionLabels(p),parking=[],takeaways=[];if(p.map.phaseParking)parking.push(['The Map',p.map.phaseParking]);if(p.map.phaseTakeaway)takeaways.push(['The Map',p.map.phaseTakeaway]);sections(p).forEach((s,i)=>{const d=sectionData(p,s.id);if(d.parking)parking.push([`The Map · ${labels[i]}`,d.parking]);if(d.takeaway)takeaways.push([`The Map · ${labels[i]}`,d.takeaway])});app.innerHTML=topbar(backButton('project','Recreation'),phaseTag('Notes'),'')+`<h2>Notes</h2><p class="sub">Keep questions and lessons in one place.</p><div class="section-kicker">Parking Lot</div>${parking.length?parking.map(([ctx,text])=>noteCard(ctx,text)).join(''):'<div class="empty">Nothing parked yet.</div>'}<div class="section-kicker">Takeaways</div>${takeaways.length?takeaways.map(([ctx,text])=>noteCard(ctx,text)).join(''):'<div class="empty">No takeaways yet.</div>'}`}
function noteCard(ctx,text){return `<div class="card card-pad" style="margin-bottom:9px"><div class="micro" style="margin-bottom:6px">${esc(ctx)}</div><div style="font-size:14px;line-height:1.5">${esc(text)}</div></div>`}
function renderOriginalSpark(){const p=project(),starts=['Lyric','Melody','Beat','Chords','Instrument part','Sound','Concept','Voice memo','Other'],reasons=['Rhythm','Emotion','Melody','Sound','Words','Energy'];app.innerHTML=topbar(backButton('project','Original Song'),phaseTag('The Spark'),savedMark())+`<h1>Start with what you have</h1><p class="sub">Capture the thing that made you want to make something.</p><div class="section-kicker">Starting With</div><div class="choice-wrap">${starts.map(x=>`<button class="choice ${p.spark.starts.includes(x)?'selected':''}" data-action="toggle-spark-start" data-name="${x}">${x}</button>`).join('')}</div><div class="section-kicker">The Idea</div><textarea class="textarea" data-input="spark-idea" placeholder="What do you have right now?">${esc(p.spark.idea)}</textarea><div class="section-kicker">What Makes It Worth Keeping?</div><div class="choice-wrap">${reasons.map(x=>`<button class="choice ${p.spark.reasons.includes(x)?'selected':''}" data-action="toggle-spark-reason" data-name="${x}">${x}</button>`).join('')}</div><div class="section-kicker">Anchor</div><textarea class="textarea" data-input="spark-anchor" placeholder="What absolutely should survive as this song grows?">${esc(p.spark.anchor)}</textarea>`}

function openAddSectionTypeSheet(){sheetRoot.innerHTML=`<div class="sheet"><div class="grabber"></div><h3>Add section</h3><div class="change-options">${SECTION_TYPES.map(name=>`<button class="change-family-row" data-action="choose-section-type" data-name="${name}"><strong>${name}</strong><span>›</span></button>`).join('')}<button class="change-family-row" data-action="choose-section-type" data-name=""><strong>Custom</strong><span>›</span></button></div><button class="sheet-close" data-action="close-sheet">Cancel</button></div>`;openSheet()}

function addSection(name,bars){name=clean(name);bars=Number(bars);if(!name||!validBars(bars))return null;const p=project();const s={id:uid(),name,lengthBars:bars};p.map.sections.push(s);p.map.sectionData[s.id]=makeSectionData();p.skeleton.session.markers[s.id]=false;p.skeleton.draft.parts[s.id]={};tracks(p).forEach(t=>p.skeleton.draft.parts[s.id][t.id]=false);invalidateStructureVerification(p);invalidateBounce(p);save();return s}
function removeSection(p,id){const idx=sectionIndexById(p,id);if(idx<0)return;const next=sections(p)[idx+1]||null;if(lengthsComplete(p))splitTimelineAtSections(p);p.map.timeline.presence.forEach(r=>{if(r.start.sectionId===id&&r.end==null&&next)r.start={sectionId:next.id,bar:0}});p.map.timeline.events.forEach(e=>{if(e.kind==='range'&&e.start.sectionId===id&&e.end==null&&next)e.start={sectionId:next.id,bar:0}});p.map.sections.splice(idx,1);delete p.map.sectionData[id];delete p.skeleton.session.markers[id];delete p.skeleton.draft.parts[id];p.map.timeline.presence=p.map.timeline.presence.filter(r=>r.start.sectionId!==id&&(r.end==null||r.end.sectionId!==id));p.map.timeline.events=p.map.timeline.events.filter(e=>e.kind==='marker'?e.point.sectionId!==id:(e.start.sectionId!==id&&(e.end==null||e.end.sectionId!==id)));reconcileTimelineAfterStructureChange(p);invalidateStructureVerification(p);invalidateMarkersFrom(p,idx);save()}

function removeTrack(p,id){const t=trackById(p,id);if(!t)return;const used=trackUsedAnywhere(p,id)||eventsForTarget(p,'track',id).length;if(used&&!confirm(`Remove ${t.name} and its mapped timeline data?`))return;p.map.tracks=p.map.tracks.filter(x=>x.id!==id);p.map.timeline.presence=p.map.timeline.presence.filter(r=>r.trackId!==id);p.map.timeline.events=p.map.timeline.events.filter(e=>!(e.targetType==='track'&&e.targetId===id));Object.values(p.map.sectionData).forEach(d=>{d.focusIds=(d.focusIds||[]).filter(x=>x!==id);if(!d.focusIds.length&&d.focusState==='selected')d.focusState=''});delete p.skeleton.session.tracks[id];Object.values(p.skeleton.draft.parts).forEach(x=>{if(x)delete x[id]});invalidateMapVerification(p);if(used)invalidateBounce(p);save()}
function addPresenceSection(p,trackId,index){const s=sections(p)[index],d=sectionData(p,s.id);p.map.timeline.presence.push({id:uid(),trackId,start:{sectionId:s.id,bar:0},end:null});d.silence=false;mergePresenceForTrack(p,trackId,false);cleanupFocusForSection(p,index);invalidateMapVerification(p);invalidateDraftTrack(p,trackId,[s.id]);save()}
function presenceGapInSection(p,trackId,index){if(!lengthsComplete(p))return null;const starts=sectionStarts(p),sec=sections(p)[index],a0=starts[index],a1=a0+Number(sec.lengthBars),intervals=presenceForTrack(p,trackId).map(r=>rangeAbs(p,r)).map(x=>({start:Math.max(a0,x.start),end:Math.min(a1,x.end)})).filter(x=>x.end>x.start+1e-6).sort((a,b)=>a.start-b.start);let cursor=a0;for(const x of intervals){if(x.start>cursor+1e-6)return {start:cursor,end:x.start};cursor=Math.max(cursor,x.end)}return cursor<a1-1e-6?{start:cursor,end:a1}:null}
function createAdditionalPresence(p,trackId,index){const gap=presenceGapInSection(p,trackId,index);if(!gap)return null;const future=presenceForTrack(p,trackId).map(r=>rangeAbs(p,r)).filter(x=>x.start>gap.start+1e-6).sort((a,b)=>a.start-b.start)[0],r={id:uid(),trackId,start:anchorAtAbs(p,gap.start,false),end:future?anchorAtAbs(p,future.start,true):null};p.map.timeline.presence.push(r);sectionData(p,sections(p)[index].id).silence=false;return r}
function subtractSectionFromTrack(p,trackId,index){if(!lengthsComplete(p))return;const s=sections(p)[index],starts=sectionStarts(p),secStart=starts[index],secEnd=secStart+Number(s.lengthBars),out=[];presenceForTrack(p,trackId).forEach(r=>{const a=rangeAbs(p,r);if(a.end<=secStart+1e-6||a.start>=secEnd-1e-6){out.push(r);return}if(a.start<secStart-1e-6)out.push({id:uid(),trackId,start:r.start,end:anchorAtAbs(p,secStart,true)});if(a.end>secEnd+1e-6)out.push({id:uid(),trackId,start:anchorAtAbs(p,secEnd,false),end:r.end})});p.map.timeline.presence=p.map.timeline.presence.filter(r=>r.trackId!==trackId).concat(out);mergePresenceForTrack(p,trackId,false);invalidateDraftTrack(p,trackId,[s.id])}
function eventCoveredByPresence(p,e,startAbs,endAbs){if(e.targetType!=='track')return true;return presenceForTrack(p,e.targetId).some(r=>{const a=rangeAbs(p,r);return startAbs>=a.start-1e-6&&endAbs<=a.end+1e-6})}
function reconcileStateProperty(p,event){if(!event||event.kind!=='range'||!event.property)return;const list=p.map.timeline.events.filter(e=>e.kind==='range'&&e.property===event.property&&e.targetType===event.targetType&&(e.targetType==='mix'||e.targetId===event.targetId)).sort((a,b)=>anchorAbs(p,a.start)-anchorAbs(p,b.start));for(let i=0;i<list.length-1;i++){const cur=list[i],next=list[i+1],nextStart=anchorAbs(p,next.start),curEnd=cur.end==null?Infinity:anchorAbs(p,cur.end);if(curEnd>nextStart+1e-6)cur.end={...next.start}}}

function installSorting(){const container=document.getElementById('sortList');if(!container)return;container.querySelectorAll('[data-drag-handle]').forEach(handle=>{handle.addEventListener('pointerdown',startDrag,{passive:false});handle.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()})});function startDrag(e){if(e.button!==undefined&&e.button!==0)return;e.preventDefault();e.stopPropagation();const handle=e.currentTarget,row=handle.closest('.sort-row');if(!row)return;try{handle.setPointerCapture(e.pointerId)}catch(_){}const rect=row.getBoundingClientRect(),offsetY=e.clientY-rect.top,placeholder=document.createElement('div'),ghost=row.cloneNode(true);placeholder.className='sort-placeholder';placeholder.style.height=rect.height+'px';ghost.classList.add('sort-ghost');Object.assign(ghost.style,{left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px'});row.replaceWith(placeholder);document.body.appendChild(ghost);document.body.classList.add('is-sorting');const move=ev=>{ev.preventDefault();const y=clamp(ev.clientY-offsetY,8,innerHeight-rect.height-8);ghost.style.top=y+'px';const mid=ev.clientY,others=[...container.querySelectorAll('.sort-row')];for(const other of others){const r=other.getBoundingClientRect();if(mid<r.top+r.height/2){container.insertBefore(placeholder,other);return}}container.appendChild(placeholder)};const end=()=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',end);handle.removeEventListener('pointercancel',end);const p=project(),id=row.dataset.sectionId,targetIndex=[...container.children].indexOf(placeholder),fromIndex=sectionIndexById(p,id);if(lengthsComplete(p))splitTimelineAtSections(p);const item=p.map.sections.splice(fromIndex,1)[0];p.map.sections.splice(targetIndex,0,item);reconcileTimelineAfterStructureChange(p);ghost.remove();placeholder.replaceWith(row);document.body.classList.remove('is-sorting');invalidateStructureVerification(p);invalidateMarkersFrom(p,Mat
