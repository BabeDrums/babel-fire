.horizontal-nav{display:flex;gap:7px;overflow-x:auto;padding:2px 0 7px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.horizontal-nav::-webkit-scrollbar{display:none}.section-tab{white-space:nowrap;min-height:36px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.022);font-size:12px;color:var(--muted);cursor:pointer}.section-tab.current{background:var(--accent-soft);border-color:rgba(228,216,75,.3);color:var(--accent-text)}.section-tab.done:before{content:"✓ ";color:var(--accent)}
.study-block{padding:18px 0 4px;border-top:0;margin-top:10px}.study-block:first-of-type{margin-top:0}.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px}.block-head strong{font-size:16px}.block-head span{font-size:12px;color:var(--muted)}

details.note-disclosure{border:1px solid var(--line);border-radius:17px;padding:0 14px;margin-top:24px;background:rgba(255,255,255,.024)}details.note-disclosure[open]{padding-bottom:13px}details.note-disclosure summary{list-style:none;cursor:pointer;min-height:58px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:650}details.note-disclosure summary::-webkit-details-marker{display:none}details.note-disclosure summary:after{content:"+";font-size:22px;color:var(--muted);font-weight:350}details.note-disclosure[open] summary:after{content:"–"}.note-grid{display:grid;gap:13px;padding:5px 0 3px}.note-grid label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 2px}

.road-phase{padding:16px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.022);margin-bottom:9px}.road-phase.done{background:rgba(228,216,75,.035);border-color:rgba(228,216,75,.12)}.road-phase.active{border-color:rgba(228,216,75,.25)}.road-top{display:grid;grid-template-columns:28px 1fr auto;gap:11px;align-items:start}.road-num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);font-size:12px;color:var(--muted)}.road-phase.active .road-num{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}.road-phase h3{font-size:16px}.road-phase p{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}.road-checks{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 39px}.road-check{font-size:11px;color:var(--muted);padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.032);border:1px solid var(--line)}
.project-card{position:relative;width:100%;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.026);margin-bottom:10px;overflow:hidden}.project-open{appearance:none;-webkit-appearance:none;width:100%;text-align:left;padding:18px 54px 18px 18px;color:var(--text);cursor:pointer}.project-card .type{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}.project-card strong{display:block;font-size:20px;margin-bottom:3px}.project-card .artist{font-size:13px;color:var(--muted)}.project-card .foot{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:15px;font-size:12px;color:var(--muted)}.project-menu{position:absolute;top:11px;right:9px;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:var(--muted);font-size:19px;cursor:pointer}.project-menu:active{background:rgba(255,255,255,.055);color:var(--text)}
.new-type{display:grid;grid-template-columns:1fr 1fr;gap:10px}.type-card{min-height:120px;text-align:left;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.026);padding:16px;cursor:pointer}.type-card.selected{background:var(--accent-soft);border-color:rgba(228,216,75,.3)}.type-card strong{display:block;font-size:16px;margin-bottom:6px}.type-card span{display:block;font-size:12px;color:var(--muted);line-height:1.4}.type-card.selected span{color:#d9d7ae}

.phase-nav-row strong{display:block;font-size:14px}
.phase-nav-row span.copy{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.phase-nav-arrow{font-size:19px;color:var(--muted)}
.phase-nav-project{width:100%;min-height:62px;padding:11px 13px;margin-bottom:12px;border-radius:16px;border:1px solid var(--line-strong);background:rgba(255,255,255,.045);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:left;color:var(--text);cursor:pointer}
.phase-nav-project strong{display:block;font-size:15px}.phase-nav-project span.copy{display:block;font-size:11px;color:var(--muted);margin-top:3px}.phase-nav-project .phase-nav-arrow{align-self:center}

.phase-home{display:block}
.requirement-note{min-height:20px;text-align:center;color:var(--muted);font-size:12px;line-height:1.4;margin-top:8px}
.road-phase.clickable{cursor:pointer;width:100%;text-align:left;color:inherit}
.road-phase.clickable:active{background:rgba(255,255,255,.04)}

@media(max-width:430px){.app-shell{padding-left:16px;padding-right:16px}h1{font-size:37px}.setup-row{grid-template-columns:1fr 126px}.setup-value,.state-control{width:126px}.scale-row{grid-template-columns:68px 1fr;gap:8px}.segment{font-size:11.5px}.quick-grid{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app-shell" id="app"></div>
<div id="sheetRoot" class="sheet-backdrop" aria-hidden="true"></div>
<input id="importFile" type="file" accept="application/json" hidden>
<script>
(()=>{
'use strict';
const DB_KEY='production-projects-v1';
const LEGACY_KEYS=['smithereens-map-v6','smithereens-map-v5','smithereens-map-v2'];
const FEEL_SCALES={
  depth:['Close','Mixed','Distant'],
  space:['Dry','Mixed','Wet'],
  width:['Narrow','Mixed','Wide'],
  density:['Sparse','Balanced','Dense'],
  energy:['Low','Medium','High']
};
const FEEL_LABELS={depth:'Depth',space:'Space',width:'Width',density:'Density',energy:'Energy'};
const SECTION_TYPES=['Intro','Verse','Pre-Chorus','Chorus','Bridge','Instrumental','Outro'];
const COMMON_PARTS=['Vocal','Drums','Bass','Ukulele','Guitar','Piano','Synth','Backing vocals','Percussion','FX'];
const STUDY_PHASES=[
  {key:'map',title:'The Map',desc:'Understand the song before rebuilding it.',route:'map',checkpoints:['Structure','Tracks','Section Study']},
  {key:'skeleton',title:'The Skeleton',desc:'Build the rough song.',route:'skeleton',checkpoints:['Session','Backbone','Full Rough']},
  {key:'sounds',title:'The Sounds',desc:'Match sounds and performances.',route:'roadmap',checkpoints:['Sources','Performance','Character']},
  {key:'balance',title:'The Balance',desc:'Set levels, pan, and hierarchy.',route:'roadmap',checkpoints:['Levels','Pan','Hierarchy']},
  {key:'shape',title:'The Shape',desc:'Shape tone and dynamics.',route:'roadmap',checkpoints:['Frequency','Dynamics','Character']},
  {key:'world',title:'The World',desc:'Create depth, width, and movement.',route:'roadmap',checkpoints:['Depth','Width','Movement']},
  {key:'finish',title:'The Finish',desc:'Compare, revise, finish.',route:'roadmap',checkpoints:['A/B','Revise','Deliver']}
];
const ORIGINAL_PHASES=[
  ['The Spark','Capture the thing worth making.'],
  ['The Direction','Decide where the idea wants to go.'],
  ['The Skeleton','Build a rough song from beginning to end.'],
  ['The Production','Develop arrangement, transitions, and identity.'],
  ['The Recording','Replace placeholders with intentional performances.'],
  ['The Mix','Balance, shape, and place the record.'],
  ['The Finish','Reference, revise, and commit.']
];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>crypto?.randomUUID?.()||('id-'+Date.now().toString(36)+Math.random().toString(36).slice(2));
const clean=s=>String(s??'').trim();
const app=document.getElementById('app');
const sheetRoot=document.getElementById('sheetRoot');
let saveFlashTimer=null;
let ui={route:'projects',sectionIndex:0,newType:'original',selectedTarget:null};

function makeStudyProject(title='Smithereens',artist='Twenty One Pilots'){
  return {
    id:uid(),type:'study',title,artist,createdAt:Date.now(),
    map:{
      setup:{reference:false,tempo:'',meter:'4/4',grid:false,firstListen:false},
      sections:[],structureVerified:false,ingredients:[],unknowns:[],analysis:{},transitions:{},
      mapVerified:false,teachBack:false,phaseParking:'',phaseTakeaway:''
    },
    skeleton:{session:{tracks:{},markers:false},backbone:{sections:{}},rough:{parts:{},bounce:false}},
    notes:[]
  };
}
function makeOriginalProject(title='Untitled'){
  return {
    id:uid(),type:'original',title:title||'Untitled',createdAt:Date.now(),
    spark:{starts:[],idea:'',reasons:[],anchor:''},notes:[]
  };
}
function seedDB(){
  const p=makeStudyProject();p.id='smithereens';
  return {version:1,currentProjectId:p.id,projects:[p]};
}
function migrateLegacy(){
  for(const key of LEGACY_KEYS){
    try{
      const old=JSON.parse(localStorage.getItem(key));
      if(!old) continue;
      const p=makeStudyProject();p.id='smithereens';
      if(old.setup) p.map.setup={
        reference:!!old.setup.reference,tempo:old.setup.tempo||'',meter:old.setup.meter||'4/4',
        grid:!!(old.setup.grid??old.setup.alignment),firstListen:!!(old.setup.firstListen??old.setup.listen)
      };
      p.map.sections=(old.sections||[]).map((s,i)=>typeof s==='string'?{id:'legacy-'+i+'-'+uid(),name:s}:{id:s.id||uid(),name:s.name||'Section'});
      p.map.structureVerified=!!(old.structureVerified??old.transitionsChecked);
      p.map.ingredients=[...(old.ingredients||old.parts||[])];
      p.map.unknowns=[...(old.unknowns||[])];
      p.map.phaseParking=old.phaseParking||old.parkingLot||'';
      p.map.phaseTakeaway=old.phaseTakeaway||old.babelTakeaway||'';
      p.map.teachBack=!!old.teachBack;
      p.map.analysis=old.analysis||old.sectionAnalysis||{};
      p.map.transitions=old.transitions||{};
      return {version:1,currentProjectId:p.id,projects:[p]};
    }catch(e){}
  }
  return null;
}
function loadDB(){
  try{
    const saved=JSON.parse(localStorage.getItem(DB_KEY));
    if(saved?.projects?.length) return saved;
  }catch(e){}
  return migrateLegacy()||seedDB();
}
let db=loadDB();
function normalizeDB(){
  db.version=2;
  (db.projects||[]).forEach(p=>{
    delete p.guidance;
    if(p.type==='study'&&p.map){
      p.map.setup=p.map.setup||{reference:false,tempo:'',meter:'4/4',grid:false,firstListen:false};
      p.map.sections=p.map.sections||[];
      p.map.ingredients=[...new Set([...(p.map.ingredients||[]),...(p.map.unknowns||[])])];
      p.map.unknowns=[];
      p.map.analysis=p.map.analysis||{};
      p.map.transitions=p.map.transitions||{};
      p.map.mapVerified=!!p.map.mapVerified;
      p.map.teachBack=!!p.map.teachBack;
      p.map.phaseParking=p.map.phaseParking||'';
      p.map.phaseTakeaway=p.map.phaseTakeaway||'';
      p.skeleton=p.skeleton||{session:{tracks:{},markers:false},backbone:{sections:{}},rough:{parts:{},bounce:false}};
      p.skeleton.session=p.skeleton.session||{tracks:{},markers:false};
      p.skeleton.session.tracks=p.skeleton.session.tracks||{};
      p.skeleton.backbone=p.skeleton.backbone||{sections:{}};
      p.skeleton.backbone.sections=p.skeleton.backbone.sections||{};
      p.skeleton.rough=p.skeleton.rough||{parts:{},bounce:false};
      p.skeleton.rough.parts=p.skeleton.rough.parts||{};
      Object.values(p.map.analysis).forEach(a=>{
        a.parts=a.parts||[];
        a.partsStatus=a.partsStatus||'';
        if(a.partsEdited===undefined)a.partsEdited=true;
        a.feel=a.feel||{};
        delete a.feelUnsure;
        a.focus=a.focus||[];
        if(a.focusState==='unsure')a.focusState='';
        a.focusState=a.focusState||'';
        a.parking=a.parking||'';
        a.takeaway=a.takeaway||'';
      });
      Object.values(p.map.transitions).forEach(t=>{
        t.changes=t.changes||[];
        if(t.status==='unsure')t.status='';
        t.status=t.status||'';
      });
    }
  });
  try{localStorage.setItem(DB_KEY,JSON.stringify(db));}catch(e){}
}
normalizeDB();
function save(){
  try{localStorage.setItem(DB_KEY,JSON.stringify(db));}catch(e){}
  clearTimeout(saveFlashTimer);
  document.querySelectorAll('.saved').forEach(el=>el.classList.add('show'));
  saveFlashTimer=setTimeout(()=>document.querySelectorAll('.saved').forEach(el=>el.classList.remove('show')),700);
}
function project(){return db.projects.find(p=>p.id===db.currentProjectId)||db.projects[0]}
function go(route,extra={},push=true){
  ui={...ui,...extra,route};
  if(push){try{history.pushState({route,...extra},'',location.pathname+location.search)}catch(e){}}
  render();window.scrollTo(0,0);
}
window.addEventListener('popstate',e=>{ui={...ui,...(e.state||{}),route:e.state?.route||'project'};render()});
function backButton(target='project',label='Back'){return `<button class="nav-btn left" data-action="go" data-route="${target}"><span class="arrow">‹</span>${esc(label)}</button>`}
function topbar(left='',center='',right=''){return `<div class="topbar"><div class="left">${left}</div><div class="center">${center}</div><div class="right">${right}</div></div>`}
function savedMark(){return `<span class="saved">Saved</span>`}
function phaseTag(text){return `<span class="pill-tag">${esc(text)}</span>`}
function phasePill(index){
  const ph=STUDY_PHASES[index];
  return `<button class="phase-pill" data-action="phase-nav" data-phase-index="${index}" aria-label="Navigate study phases">${esc(ph.title)}</button>`;
}
function studyPhaseUnlocked(p,index){return index===0||index<=currentStudyPhaseIndex(p)}
function studyPhaseDone(p,index){if(index===0)return mapDone(p);if(index===1)return skeletonDone(p);return false}
function studyPhaseRoute(index){return STUDY_PHASES[index]?.route||'roadmap'}
function progressBar(done,total){const pct=total?Math.round(done/total*100):0;return `<div class="progress"><span style="width:${pct}%"></span></div><div class="progress-meta"><span>${done} of ${total}</span></div>`}
function sectionLabels(p){
  const counts={};p.map.sections.forEach(s=>counts[s.name]=(counts[s.name]||0)+1);const seen={};
  return p.map.sections.map(s=>{if(counts[s.name]>1){seen[s.name]=(seen[s.name]||0)+1;return `${s.name} ${seen[s.name]}`}return s.name});
}
function availableParts(p){return [...new Set(p.map.ingredients||[])];}
function ensureAnalysis(p,index){
  const s=p.map.sections[index];if(!s)return null;
  if(!p.map.analysis[s.id]){
    const previous=index>0?ensureAnalysis(p,index-1):null;
    const inherited=previous?.parts?.slice()||[];
    p.map.analysis[s.id]={parts:inherited,partsStatus:inherited.length?'mapped':'',partsEdited:false,feel:{depth:null,space:null,width:null,density:null,energy:null},focus:[],focusState:'',parking:'',takeaway:'',visited:false};
    save();
  }
  const a=p.map.analysis[s.id];
  a.parts=a.parts||[];a.partsStatus=a.partsStatus||'';if(a.partsEdited===undefined)a.partsEdited=true;
  a.feel=a.feel||{};delete a.feelUnsure;a.focus=a.focus||[];if(a.focusState==='unsure')a.focusState='';a.focusState=a.focusState||'';
  return a;
}
function transitionKey(a,b){return `${a}→${b}`}
function ensureTransition(p,index){
  if(index<1) return null;const prev=p.map.sections[index-1],cur=p.map.sections[index];if(!prev||!cur)return null;
  const key=transitionKey(prev.id,cur.id);if(!p.map.transitions[key])p.map.transitions[key]={changes:[],status:''};return p.map.transitions[key];
}
function feelComplete(a){return Object.keys(FEEL_SCALES).every(k=>!!a.feel?.[k])}
function sectionComplete(p,index){
  const s=p.map.sections[index];if(!s)return false;
  const a=p.map.analysis[s.id];if(!a||!a.partsStatus||!feelComplete(a)||!a.focusState)return false;
  if(index===0)return true;
  const prev=p.map.sections[index-1];const t=prev?p.map.transitions[transitionKey(prev.id,s.id)]:null;
  return !!(t?.changes?.length||t?.status);
}
function structureDone(p){return p.map.sections.length>0&&p.map.structureVerified}
function ingredientsDone(p){return availableParts(p).length>0}
function sectionStudyDone(p){return p.map.sections.length>0&&p.map.sections.every((_,i)=>sectionComplete(p,i))}
function mapSetupComplete(p){const s=p.map.setup||{};return !!(s.reference&&clean(s.tempo)&&s.meter&&s.grid&&s.firstListen)}
function mapDone(p){return mapSetupComplete(p)&&structureDone(p)&&ingredientsDone(p)&&sectionStudyDone(p)&&p.map.mapVerified&&p.map.teachBack}
function skeletonSessionDone(p){const parts=availableParts(p);return !!p.skeleton.session.markers&&parts.every(x=>p.skeleton.session.tracks[x])}
function skeletonBackboneDone(p){return p.map.sections.length>0&&p.map.sections.every(s=>p.skeleton.backbone.sections[s.id])}
function skeletonRoughDone(p){
  if(!p.map.sections.length)return false;
  const every=p.map.sections.every((s,i)=>{const a=ensureAnalysis(p,i);const parts=a.parts||[];return parts.every(part=>p.skeleton.rough.parts[s.id]?.[part]);});
  return every&&!!p.skeleton.rough.bounce;
}
function skeletonDone(p){return skeletonSessionDone(p)&&skeletonBackboneDone(p)&&skeletonRoughDone(p)}
function currentStudyPhaseIndex(p){if(!mapDone(p))return 0;if(!skeletonDone(p))return 1;return 2}
function studyPhaseStatus(p,i){if(studyPhaseDone(p,i))return 'done';if(currentStudyPhaseIndex(p)===i)return 'current';return 'future'}

function mapCheckpointCount(p){return [structureDone(p),ingredientsDone(p),sectionStudyDone(p)].filter(Boolean).length}
function skeletonCheckpointCount(p){return [skeletonSessionDone(p),skeletonBackboneDone(p),skeletonRoughDone(p)].filter(Boolean).length}
function originalSparkDone(p){return !!(p.spark?.idea?.trim()||p.spark?.starts?.length)&&!!(p.spark?.anchor?.trim()||p.spark?.reasons?.length)}

function render(){
  switch(ui.route){
    case 'projects':return renderProjects();
    case 'new-project':return renderNewProject();
    case 'roadmap':return renderRoadmap();
    case 'notes':return renderNotes();
    case 'map':return renderMapHome();
    case 'structure':return renderStructure();
    case 'ingredients':return renderIngredients();
    case 'section-study':return renderSectionStudy();
    case 'map-summary':return renderMapSummary();
    case 'skeleton':return renderSkeletonHome();
    case 'skeleton-session':return renderSkeletonSession();
    case 'skeleton-backbone':return renderSkeletonBackbone();
    case 'skeleton-rough':return renderSkeletonRough();
    case 'original-spark':return renderOriginalSpark();
    default:return renderProject();
  }
}


function renderProjects(){
  app.innerHTML=topbar('',phaseTag('FIRE'),`<button class="top-icon-btn" data-action="new-project" aria-label="New project">+</button>`)+`
    <h1>Projects</h1><p class="sub">Original songs and recreations.</p>
    <div class="spacer-24"></div>
    ${db.projects.length?db.projects.map(p=>{
      const phase=p.type==='study'?STUDY_PHASES[currentStudyPhaseIndex(p)].title:(originalSparkDone(p)?'The Direction':'The Spark');
      return `<div class="project-card"><button class="project-open" data-action="open-project" data-id="${p.id}"><div class="type">${p.type==='study'?'Recreation':'Original Song'}</div><strong>${esc(p.title)}</strong>${p.artist?`<div class="artist">${esc(p.artist)}</div>`:''}<div class="foot"><span>${esc(phase)}</span><span>Open ›</span></div></button><button class="project-menu" data-action="project-menu" data-id="${p.id}" aria-label="Project options">•••</button></div>`;
    }).join(''):`<div class="empty">No projects yet. Tap + to start one.</div>`}`;
}

function renderProject(){
  const p=project();if(!p)return go('projects',{},false);
  if(p.type==='original')return renderOriginalOverview();
  const phaseIndex=currentStudyPhaseIndex(p),phase=STUDY_PHASES[phaseIndex],done=phaseIndex===0?mapCheckpointCount(p):phaseIndex===1?skeletonCheckpointCount(p):0;
  const next=STUDY_PHASES[phaseIndex+1];
  app.innerHTML=topbar(`<button class="nav-btn" data-action="go" data-route="projects"><span class="arrow">‹</span>Projects</button>`,phaseTag('Recreation'),`<button class="text-btn" data-action="settings">•••</button>`)+`
    <div class="eyebrow">${esc(p.artist||'Recreation')}</div><h1>${esc(p.title)}</h1>
    <div class="spacer-18"></div>
    <div class="hero-card">
      <div class="phase-line"><div><div class="eyebrow" style="margin:0 0 6px">Current Phase</div><h3>${esc(phase.title)}</h3></div><div class="phase-num">Phase ${phaseIndex+1} of 7</div></div>
      <p class="sub">${esc(phase.desc)}</p>
      ${phaseIndex<2?progressBar(done,3):''}
      <div class="spacer-18"></div>
      <button class="primary full" data-action="go" data-route="${phase.route}">${phaseIndex===0?(mapCheckpointCount(p)?'Continue The Map':'Start The Map'):phaseIndex===1?(skeletonCheckpointCount(p)?'Continue The Skeleton':'Start The Skeleton'):'View Roadmap'}</button>
    </div>
    ${next?`<div class="section-kicker">Next</div><div class="group-card list"><div class="list-row static"><span class="status-dot"></span><div><div class="title">${esc(next.title)}</div><div class="desc">${esc(next.desc)}</div></div><span class="chev"></span></div></div>`:''}
    <div class="section-kicker">Project</div>
    <div class="quick-grid">
      <button class="quick-card" data-action="go" data-route="roadmap"><strong>Roadmap</strong><span>Seven phases to a finished rebuild.</span></button>
      <button class="quick-card" data-action="go" data-route="notes"><strong>Notes</strong><span>Questions and takeaways.</span></button>
    </div>`;
}

function renderOriginalOverview(){
  const p=project(),done=originalSparkDone(p);
  app.innerHTML=topbar(`<button class="nav-btn" data-action="go" data-route="projects"><span class="arrow">‹</span>Projects</button>`,phaseTag('Original Song'),`<button class="text-btn" data-action="settings">•••</button>`)+`
    <h1>${esc(p.title)}</h1><p class="sub">Take anything worth keeping and turn it into a finished record.</p>
    <div class="spacer-24"></div>
    <div class="hero-card"><div class="phase-line"><div><div class="eyebrow" style="margin:0 0 6px">Current Phase</div><h3>The Spark</h3></div><div class="phase-num">Phase 1 of 7</div></div><p class="sub">Capture the thing worth making before you overthink it.</p>${progressBar(done?1:0,1)}<div class="spacer-18"></div><button class="primary full" data-action="go" data-route="original-spark">${done?'Open The Spark':'Start The Spark'}</button></div>
    <div class="section-kicker">Roadmap</div><div class="list">${ORIGINAL_PHASES.slice(1,4).map((ph,i)=>`<div class="list-row static"><span class="status-dot"></span><div><div class="title">${esc(ph[0])}</div><div class="desc">${esc(ph[1])}</div></div><span class="count-badge">${i+2}</span></div>`).join('')}</div>`;
}

function renderNewProject(){
  app.innerHTML=topbar(backButton('projects','Projects'),phaseTag('New Project'),'')+`
    <h2>New project</h2><p class="sub">Start original or rebuild a reference.</p>
    <div class="spacer-24"></div>
    <div class="new-type">
      <button class="type-card ${ui.newType==='original'?'selected':''}" data-action="set-new-type" data-type="original"><strong>Original Song</strong><span>Start with a lyric, beat, melody, sound, concept, or anything else.</span></button>
      <button class="type-card ${ui.newType==='study'?'selected':''}" data-action="set-new-type" data-type="study"><strong>Recreation</strong><span>Rebuild an existing song to learn how it works.</span></button>
    </div>
    <div class="section-kicker">Project</div>
    <input class="field" id="newTitle" placeholder="${ui.newType==='study'?'Song title':'Song title or Untitled'}">
    ${ui.newType==='study'?`<div class="spacer-10"></div><input class="field" id="newArtist" placeholder="Artist">`:''}
    <div class="spacer-24"></div><button class="primary full" data-action="create-project">Create Project</button>`;
}

function renderMapHome(){
  const p=project(),m=p.map,done=mapCheckpointCount(p),setupDone=mapSetupComplete(p);
  const structureUnlocked=setupDone||structureDone(p);
  const ingredientsUnlocked=structureDone(p)||ingredientsDone(p)||sectionStudyDone(p);
  const studyUnlocked=(structureDone(p)&&ingredientsDone(p))||sectionStudyDone(p);
  const studyRoute=sectionStudyDone(p)?'map-summary':'section-study';

  const setup=`
    <div class="section-kicker">Song Setup</div>
    <div class="group-card setup-panel">
      <div class="setup-row"><div class="setup-label">Reference</div><button class="state-control ${m.setup.reference?'on':''}" data-action="toggle-setup" data-field="reference"><span>${m.setup.reference?'Imported':'Import'}</span><span class="check-circle"></span></button></div>
      <div class="setup-row"><div class="setup-label">Tempo</div><div class="setup-value"><input id="tempoInput" inputmode="numeric" value="${esc(m.setup.tempo)}" placeholder="—"><span class="suffix">BPM</span></div></div>
      <div class="setup-row"><div class="setup-label">Meter</div><div class="setup-value"><select id="meterInput">${['4/4','3/4','6/8','5/4','7/8'].map(x=>`<option ${m.setup.meter===x?'selected':''}>${x}</option>`).join('')}</select></div></div>
      <div class="setup-row"><div class="setup-label">Grid</div><button class="state-control ${m.setup.grid?'on':''}" data-action="toggle-setup" data-field="grid"><span>${m.setup.grid?'Aligned':'Align'}</span><span class="check-circle"></span></button></div>
    </div>
    <div class="spacer-18"></div>
    ${actionCard('First Listen','Play the full song once without stopping.',m.setup.firstListen,'toggle-setup','first-listen',false,'data-field="firstListen"')}`;

  const checkpoints=`
      ${checkpointRow('Structure','Map the form.','structure',structureDone(p),structureUnlocked)}
      ${checkpointRow('Tracks','Identify what plays.','ingredients',ingredientsDone(p),ingredientsUnlocked)}
      ${checkpointRow('Section Study','Understand each section.',studyRoute,sectionStudyDone(p),studyUnlocked)}`;

  app.innerHTML=phaseHome(0,done,3,checkpoints,setup,'');
}

function checkpointRow(title,desc,route,done,unlocked=true){
  return `<button class="list-row checkpoint-row" data-action="go" data-route="${route}" ${unlocked?'':'disabled'}>${done?`<span class="round-check on" aria-hidden="true"></span>`:unlocked?`<span class="status-dot"></span>`:`<span class="lock-dot">•</span>`}<div><div class="title">${esc(title)}</div><div class="desc">${esc(desc)}</div></div><span class="chev">${unlocked?'›':''}</span></button>`;
}

function actionCard(title,copy,on,action,id='',disabled=false,attrs=''){
  return `<button class="action-card ${on?'on':''}" ${id?`id="${id}"`:''} data-action="${action}" ${attrs} ${disabled?'disabled':''}><div><strong>${esc(title)}</strong>${copy?`<span class="copy">${esc(copy)}</span>`:''}</div><span class="round-check ${on?'on':''}" aria-hidden="true"></span></button>`;
}
function phaseHome(index,done,total,checkpointsHtml,beforeHtml='',afterHtml=''){
  const pct=total?Math.round(done/total*100):0;
  return topbar(backButton('project','Recreation'),phasePill(index),savedMark())+
    beforeHtml+

  sheetRoot.innerHTML=`<div class="sheet"><div class="grabber"></div><h3>${esc(p.title)}</h3>${p.artist?`<div class="micro" style="margin-top:5px">${esc(p.artist)}</div>`:''}<div class="sheet-actions" style="margin-top:18px"><button class="destructive full" data-action="delete-project" data-id="${p.id}">Delete Project</button><button class="sheet-close" data-action="close-sheet">Cancel</button></div></div>`;
  sheetRoot.classList.add('open');sheetRoot.setAttribute('aria-hidden','false');
}
function closeSheet(){sheetRoot.classList.remove('open');sheetRoot.setAttribute('aria-hidden','true');setTimeout(()=>sheetRoot.innerHTML='',150)}

function addSection(name){name=clean(name);if(!name)return;const p=project();p.map.sections.push({id:uid(),name});save();renderStructure()}
function toggleArray(arr,val){const i=arr.indexOf(val);if(i>=0)arr.splice(i,1);else arr.push(val)}
function syncPresenceChanges(p,index){
  if(index<1)return;
  const prev=ensureAnalysis(p,index-1),cur=ensureAnalysis(p,index),t=ensureTransition(p,index),known=availableParts(p);
  t.changes=(t.changes||[]).filter(c=>!(known.includes(c.target)&&(c.action==='Enters'||c.action==='Leaves')));
  known.forEach(part=>{
    const was=(prev.parts||[]).includes(part),now=(cur.parts||[]).includes(part);
    if(!was&&now)t.changes.push({target:part,action:'Enters',presence:true});
    if(was&&!now)t.changes.push({target:part,action:'Leaves',presence:true});
  });
  if(t.changes.length)t.status='';
}
function inheritPartsFromPrevious(p,index){
  if(index<1||index>=p.map.sections.length)return;
  const prev=ensureAnalysis(p,index-1),cur=ensureAnalysis(p,index);
  if(cur.partsEdited)return;
  cur.parts=(prev.parts||[]).slice();
  cur.partsStatus=cur.parts.length?'mapped':(prev.partsStatus==='silence'?'silence':'');
  cur.focus=(cur.focus||[]).filter(x=>cur.parts.includes(x));
  if(!cur.focus.length&&cur.focusState==='selected')cur.focusState='';
}
function reconcilePresenceAfterEdit(p,index){
  if(index>0)syncPresenceChanges(p,index);
  for(let j=index+1;j<p.map.sections.length;j++){
    const next=ensureAnalysis(p,j);
    if(next.partsEdited){syncPresenceChanges(p,j);break;}
    inheritPartsFromPrevious(p,j);
    syncPresenceChanges(p,j);
  }
}
function reconcileAllPresence(p){
  for(let i=1;i<p.map.sections.length;i++){
    const a=ensureAnalysis(p,i);
    if(!a.partsEdited)inheritPartsFromPrevious(p,i);
    syncPresenceChanges(p,i);
  }
}
function setSectionPartPresence(p,index,name,on){
  const a=ensureAnalysis(p,index),has=a.parts.includes(name);
  if(on&&!has)a.parts.push(name);
  if(!on&&has)a.parts=a.parts.filter(x=>x!==name);
  a.partsEdited=true;
  a.partsStatus=a.parts.length?'mapped':'silence';
  a.focus=a.focus.filter(x=>a.parts.includes(x));
  if(!a.focus.length&&a.focusState==='selected')a.focusState='';
  reconcilePresenceAfterEdit(p,index);
}
function removePartEverywhere(p,name){
  p.map.ingredients=p.map.ingredients.filter(x=>x!==name);p.map.unknowns=p.map.unknowns.filter(x=>x!==name);
  Object.values(p.map.analysis).forEach(a=>{a.parts=(a.parts||[]).filter(x=>x!==name);a.focus=(a.focus||[]).filter(x=>x!==name);if(!a.parts.length&&a.partsStatus==='mapped')a.partsStatus=''});
  Object.values(p.map.transitions).forEach(t=>{t.changes=(t.changes||[]).filter(c=>c.target!==name)});
  if(p.skeleton?.session?.tracks)delete p.skeleton.session.tracks[name];
  Object.values(p.skeleton?.rough?.parts||{}).forEach(parts=>{if(parts)delete parts[name]});
  reconcileAllPresence(p);
}
function addChange(action){
  const p=project(),i=ui.sectionIndex,t=ensureTransition(p,i),target=ui.selectedTarget;if(!target||!action||!t)return;
  const known=availableParts(p).includes(target);
  t.status='';
  if(known&&(action==='Enters'||action==='Leaves')){
    setSectionPartPresence(p,i,target,action==='Enters');
    syncPresenceChanges(p,i);
  }else if(!t.changes.some(c=>c.target===target&&c.action===action)){
    t.changes.push({target,action});
  }
  ui.selectedTarget=null;save();renderSectionStudy();
}
function markVisitedAndAdvance(){
  const p=project(),a=ensureAnalysis(p,ui.sectionIndex);a.visited=true;if(!a.partsStatus&&a.parts.length)a.partsStatus='mapped';save();
  if(ui.sectionIndex<p.map.sections.length-1){ui.sectionIndex++;ui.selectedTarget=null;renderSectionStudy();window.scrollTo(0,0)}else go('map-summary');
}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,p=project();
  if(action==='go')return go(b.dataset.route);
  if(action==='new-project')return go('new-project');
  if(action==='project-menu')return openProjectMenu(b.dataset.id);
  if(action==='edit-section')return openSectionSheet(b.dataset.sectionId);
  if(action==='set-new-type'){ui.newType=b.dataset.type;return renderNewProject()}
  if(action==='create-project'){
    const title=clean(document.getElementById('newTitle')?.value)||'Untitled';const np=ui.newType==='study'?makeStudyProject(title,clean(document.getElementById('newArtist')?.value)):makeOriginalProject(title);db.projects.push(np);db.currentProjectId=np.id;save();return go('project');
  }
  if(action==='open-project'){db.currentProjectId=b.dataset.id;save();return go('project')}
  if(action==='settings')return openSettings();
  if(action==='phase-nav')return openPhaseNavigator(Number(b.dataset.phaseIndex));
  if(action==='go-review-map')return go('map-summary');
  if(action==='close-sheet')return closeSheet();
  if(action==='open-phase'){const idx=Number(b.dataset.index);if(studyPhaseUnlocked(p,idx)){closeSheet();return go(studyPhaseRoute(idx))}return;}
  if(action==='open-roadmap'){closeSheet();return go('roadmap');}
  if(action==='delete-project'){const id=b.dataset.id,target=db.projects.find(x=>x.id===id);if(target&&confirm(`Delete ${target.title}? This removes its saved progress from this device.`)){db.projects=db.projects.filter(x=>x.id!==id);if(db.currentProjectId===id)db.currentProjectId=db.projects[0]?.id||null;save();closeSheet();return go('projects')}return;}  if(action==='toggle-setup'){p.map.setup[b.dataset.field]=!p.map.setup[b.dataset.field];save();return renderMapHome()}
  if(action==='add-section')return addSection(b.dataset.name);
  if(action==='add-custom-section'){const input=document.getElementById('customSection');const v=clean(input?.value);if(v){addSection(v);input.value=''}return}
  if(action==='toggle-structure-verified'){p.map.structureVerified=!p.map.structureVerified;save();return renderStructure()}
  if(action==='toggle-ingredient'){const name=b.dataset.name;if(p.map.ingredients.includes(name))removePartEverywhere(p,name);else{p.map.ingredients.push(name);reconcileAllPresence(p)}save();return renderIngredients()}
  if(action==='add-custom-part'){const input=document.getElementById('customPart');const v=clean(input?.value);if(v&&!p.map.ingredients.includes(v)){p.map.ingredients.push(v);input.value='';reconcileAllPresence(p);save();renderIngredients()}return}
  if(action==='remove-custom-part'){removePartEverywhere(p,b.dataset.name);save();return renderIngredients()}
  if(action==='start-section-study'){ui.sectionIndex=0;ui.selectedTarget=null;return go('section-study')}
  if(action==='jump-section'){ui.sectionIndex=Number(b.dataset.index);ui.selectedTarget=null;return renderSectionStudy()}
  if(action==='toggle-section-part'){const a=ensureAnalysis(p,ui.sectionIndex),name=b.dataset.name;setSectionPartPresence(p,ui.sectionIndex,name,!a.parts.includes(name));save();return renderSectionStudy()}
  if(action==='section-silence'){const a=ensureAnalysis(p,ui.sectionIndex);if(a.partsStatus==='silence'){a.partsStatus='';a.partsEdited=true}else{a.parts=[];a.focus=[];a.focusState='';a.partsStatus='silence';a.partsEdited=true}reconcilePresenceAfterEdit(p,ui.sectionIndex);save();return renderSectionStudy()}
  if(action==='set-feel'){const a=ensureAnalysis(p,ui.sectionIndex),k=b.dataset.scale;a.feel[k]=b.dataset.value;save();return renderSectionStudy()}
  if(action==='toggle-focus'){const a=ensureAnalysis(p,ui.sectionIndex);toggleArray(a.focus,b.dataset.name);a.focusState=a.focus.length?'selected':'';save();return renderSectionStudy()}
  if(action==='focus-status'){const a=ensureAnalysis(p,ui.sectionIndex),st=b.dataset.status;a.focusState=a.focusState===st?'':st;if(a.focusState)a.focus=[];save();return renderSectionStudy()}
  if(action==='transition-status'){const t=ensureTransition(p,ui.sectionIndex),st=b.dataset.status;t.status=t.status===st?'':st;if(t.status)t.changes=[];ui.selectedTarget=null;save();return renderSectionStudy()}
  if(action==='select-change-target'){ui.selectedTarget=ui.selectedTarget===b.dataset.name?null:b.dataset.name;return renderSectionStudy()}
  if(action==='use-custom-target'){const v=clean(document.getElementById('customTarget')?.value);if(v){ui.selectedTarget=v;renderSectionStudy()}return}
  if(action==='add-change')return addChange(b.dataset.value);
  if(action==='add-custom-change'){const v=clean(document.getElementById('customAction')?.value);if(v)return addChange(v);return}
  if(action==='remove-change'){
    const t=ensureTransition(p,ui.sectionIndex),idx=Number(b.dataset.index),change=t.changes[idx];
    if(change&&availableParts(p).includes(change.target)&&(change.action==='Enters'||change.action==='Leaves')){
      const prev=ensureAnalysis(p,ui.sectionIndex-1),was=prev.parts.includes(change.target);
      setSectionPartPresence(p,ui.sectionIndex,change.target,was);
      syncPresenceChanges(p,ui.sectionIndex);
    }else t.changes.splice(idx,1);
    save();return renderSectionStudy();
  }
  if(action==='prev-section'){if(ui.sectionIndex>0){ui.sectionIndex--;ui.selectedTarget=null;renderSectionStudy();window.scrollTo(0,0)}return}
  if(action==='next-section')return markVisitedAndAdvance();
  if(action==='summary-jump'){ui.sectionIndex=Number(b.dataset.index);ui.selectedTarget=null;return go('section-study')}
  if(action==='toggle-map-verified'){p.map.mapVerified=!p.map.mapVerified;save();return renderMapSummary()}
  if(action==='toggle-teach-back'){p.map.teachBack=!p.map.teachBack;save();return renderMapSummary()}
  if(action==='toggle-track'){p.skeleton.session.tracks[b.dataset.name]=!p.skeleton.session.tracks[b.dataset.name];save();return renderSkeletonSession()}
  if(action==='toggle-markers'){p.skeleton.session.markers=!p.skeleton.session.markers;save();return renderSkeletonSession()}
  if(action==='toggle-backbone'){p.skeleton.backbone.sections[b.dataset.id]=!p.skeleton.backbone.sections[b.dataset.id];save();return renderSkeletonBackbone()}
  if(action==='toggle-rough-part'){const sid=b.dataset.sectionId,name=b.dataset.name;p.skeleton.rough.parts[sid]=p.skeleton.rough.parts[sid]||{};p.skeleton.rough.parts[sid][name]=!p.skeleton.rough.parts[sid][name];save();return renderSkeletonRough()}
  if(action==='toggle-rough-bounce'){p.skeleton.rough.bounce=!p.skeleton.rough.bounce;save();return renderSkeletonRough()}
  if(action==='toggle-spark-start'){toggleArray(p.spark.starts,b.dataset.name);save();return renderOriginalSpark()}
  if(action==='toggle-spark-reason'){toggleArray(p.spark.reasons,b.dataset.name);save();return renderOriginalSpark()}
  if(action==='save-section-name'){const s=p.map.sections.find(x=>x.id===b.dataset.id),v=clean(document.getElementById('renameSection')?.value);if(s&&v)s.name=v;save();closeSheet();return renderStructure()}
  if(action==='remove-section'){
    const id=b.dataset.id,index=p.map.sections.findIndex(x=>x.id===id);if(index>=0){p.map.sections.splice(index,1);delete p.map.analysis[id];delete p.skeleton.backbone.sections[id];delete p.skeleton.rough.parts[id];Object.keys(p.map.transitions).forEach(k=>{if(k.includes(id))delete p.map.transitions[k]});reconcileAllPresence(p)}save();closeSheet();return renderStructure();
  }
  if(action==='export-backup')return exportBackup();
  if(action==='import-backup'){document.getElementById('importFile').click();return}
  if(action==='reset-project'){if(confirm(`Reset ${p.title}? This clears its saved progress.`)){const fresh=p.type==='study'?makeStudyProject(p.title,p.artist):makeOriginalProject(p.title);fresh.id=p.id;const idx=db.projects.findIndex(x=>x.id===p.id);db.projects[idx]=fresh;save();closeSheet();go('project')}return}
});

app.addEventListener('input',e=>{
  const p=project();
  if(e.target.id==='tempoInput'||e.target.id==='tempoQuick'){p.map.setup.tempo=e.target.value.replace(/[^0-9.]/g,'');save()}
  if(e.target.dataset.input==='phase-parking'){p.map.phaseParking=e.target.value;save()}
  if(e.target.dataset.input==='phase-takeaway'){p.map.phaseTakeaway=e.target.value;save()}
  if(e.target.dataset.input==='section-parking'){ensureAnalysis(p,ui.sectionIndex).parking=e.target.value;save()}
  if(e.target.dataset.input==='section-takeaway'){ensureAnalysis(p,ui.sectionIndex).takeaway=e.target.value;save()}
  if(e.target.dataset.input==='spark-idea'){p.spark.idea=e.target.value;save()}
  if(e.target.dataset.input==='spark-anchor'){p.spark.anchor=e.target.value;save()}
});
app.addEventListener('change',e=>{if(e.target.id==='meterInput'||e.target.id==='meterQuick'){project().map.setup.meter=e.target.value;save()}});
app.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.shiftKey)return;
  if(e.target.id==='customSection'){e.preventDefault();document.querySelector('[data-action="add-custom-section"]')?.click()}
  if(e.target.id==='customPart'){e.preventDefault();document.querySelector('[data-action="add-custom-part"]')?.click()}
  if(e.target.id==='customTarget'){e.preventDefault();document.querySelector('[data-action="use-custom-target"]')?.click()}
  if(e.target.id==='customAction'){e.preventDefault();document.querySelector('[data-action="add-custom-change"]')?.click()}
});

sheetRoot.addEventListener('click',e=>{
  if(e.target===sheetRoot)return closeSheet();
  const b=e.target.closest('[data-action]');if(!b)return;
  const action=b.dataset.action,p=project();
  if(action==='close-sheet')return closeSheet();
  if(action==='open-project-overview'){closeSheet();return go('project');}
  if(action==='open-phase'){const idx=Number(b.dataset.index);if(studyPhaseUnlocked(p,idx)){closeSheet();return go(studyPhaseRoute(idx))}return;}
  if(action==='open-roadmap'){closeSheet();return go('roadmap');}
  if(action==='delete-project'){const id=b.dataset.id,target=db.projects.find(x=>x.id===id);if(target&&confirm(`Delete ${target.title}? This removes its saved progress from this device.`)){db.projects=db.projects.filter(x=>x.id!==id);if(db.currentProjectId===id)db.currentProjectId=db.projects[0]?.id||null;save();closeSheet();return go('projects')}return;}
  if(action==='save-section-name'){
    const s=p.map.sections.find(x=>x.id===b.dataset.id),v=clean(document.getElementById('renameSection')?.value);
    if(s&&v)s.name=v;save();closeSheet();return renderStructure();
  }
  if(action==='remove-section'){
    const id=b.dataset.id,index=p.map.sections.findIndex(x=>x.id===id);
    if(index>=0){p.map.sections.splice(index,1);delete p.map.analysis[id];delete p.skeleton.backbone.sections[id];delete p.skeleton.rough.parts[id];Object.keys(p.map.transitions).forEach(k=>{if(k.includes(id))delete p.map.transitions[k]});reconcileAllPresence(p);}
    save();closeSheet();return renderStructure();
  }  if(action==='export-backup')return exportBackup();
  if(action==='import-backup'){document.getElementById('importFile').click();return;}
  if(action==='reset-project'){
    if(confirm(`Reset ${p.title}? This clears its saved progress.`)){
      const fresh=p.type==='study'?makeStudyProject(p.title,p.artist):makeOriginalProject(p.title);fresh.id=p.id;
      const idx=db.projects.findIndex(x=>x.id===p.id);db.projects[idx]=fresh;save();closeSheet();go('project');
    }
  }
});

function installSorting(){
  const container=document.getElementById('sortList');
  if(!container)return;
  container.querySelectorAll('[data-drag-handle]').forEach(handle=>{
    handle.addEventListener('pointerdown',startDrag,{passive:false});
    handle.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()});
  });

  function startDrag(e){
    if(e.button!==undefined&&e.button!==0)return;
    e.preventDefault();e.stopPropagation();
    const handle=e.currentTarget,row=handle.closest('.sort-row');if(!row)return;
    try{handle.setPointerCapture(e.pointerId)}catch(_){}
    const rect=row.getBoundingClientRect(),offsetY=e.clientY-rect.top,startTop=rect.top;
    const placeholder=document.createElement('div');placeholder.className='sort-placeholder';placeholder.style.height=rect.height+'px';
    const ghost=row.cloneNode(true);ghost.classList.add('sort-ghost');
    Object.assign(ghost.style,{left:rect.left+'px',top:startTop+'px',width:rect.width+'px',height:rect.height+'px',willChange:'transform'});
    row.replaceWith(placeholder);document.body.appendChild(ghost);document.body.classList.add('is-sorting');
    if(navigator.vibrate)navigator.vibrate(6);
    let lastY=e.clientY,raf=0;

    const placeAt=y=>{
      const rows=[...container.querySelectorAll('.sort-row')];let inserted=false;
      for(const candidate of rows){const r=candidate.getBoundingClientRect();if(y<r.top+r.height/2){if(placeholder.nextSibling!==candidate)container.insertBefore(placeholder,candidate);inserted=true;break;}}
      if(!inserted&&container.lastElementChild!==placeholder)container.appendChild(placeholder);
    };
    const tick=()=>{
      raf=0;
      const edge=96,step=12;
      if(lastY<edge)window.scrollBy(0,-step);
      else if(lastY>window.innerHeight-edge)window.scrollBy(0,step);
      placeAt(lastY);
    };
    const move=ev=>{
      if(ev.pointerId!==e.pointerId)return;
      ev.preventDefault();lastY=ev.clientY;
      ghost.style.transform=`translate3d(0,${ev.clientY-offsetY-startTop}px,0)`;
      if(!raf)raf=requestAnimationFrame(tick);
    };
    const end=ev=>{
      if(ev.pointerId!==e.pointerId)return;
      if(raf)cancelAnimationFrame(raf);
      document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',end);document.removeEventListener('pointercancel',end);
      placeholder.replaceWith(row);ghost.remove();document.body.classList.remove('is-sorting');
      const p=project(),ids=[...container.querySelectorAll('.sort-row')].map(x=>x.dataset.sectionId);
      p.map.sections=ids.map(id=>p.map.sections.find(s=>s.id===id)).filter(Boolean);reconcileAllPresence(p);save();renderStructure();
    };
    document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
  }
}

function exportBackup(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='production-projects-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
const importFile=document.getElementById('importFile');
importFile.addEventListener('change',async()=>{
  const file=importFile.files?.[0];if(!file)return;try{const next=JSON.parse(await file.text());if(!next?.projects)throw new Error();db=next;save();closeSheet();go('project')}catch(e){alert('That backup file could not be read.')}finally{importFile.value=''}
});

render();
})();
