<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090a0d" />
    <title>Babel FIRE</title>
    <link rel="stylesheet" href="styles.css?v={{ site.github.build_revision }}" />
    <style>
      /* Keep 44px boundary hit targets inside the musical lane at their edge. */
      .presence-handle.left,
      .event-handle.left {
        transform: none;
      }
      .presence-handle.left::after,
      .event-handle.left::after {
        left: 0;
      }
      .presence-handle.right,
      .event-handle.right {
        transform: translateX(-100%);
      }
      .presence-handle.right::after,
      .event-handle.right::after {
        left: auto;
        right: 0;
      }
    </style>
  </head>
  <body>
    <div class="app-shell" id="app"></div>
    <div id="sheetRoot" class="sheet-backdrop" aria-hidden="true"></div>
    <div id="undoNotice" class="undo-notice" role="status" hidden></div>
    <output id="dragPosition" class="drag-position" hidden></output>
    <input id="importFile" type="file" accept="application/json" hidden />
    <script src="app.js?v={{ site.github.build_revision }}" defer></script>
  </body>
</html>
