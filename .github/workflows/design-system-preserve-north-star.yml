name: Preserve FIRE north star styles

on:
  push:
    branches:
      - sol/fire-design-system-foundation
    paths:
      - .github/workflows/design-system-preserve-north-star.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/fire-design-system-foundation
      - name: Preserve locked New Project field label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('styles.css')
          text = p.read_text().rstrip()
          marker = '/* Preserve the approved Projects/New Project north-star geometry. */'
          if marker not in text:
              text += '''\n\n/* Preserve the approved Projects/New Project north-star geometry. */
          #app[data-route="new-project"] .project-field-label {
            margin: 18px 2px 8px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 650;
            letter-spacing: 0;
            text-transform: none;
          }'''
          p.write_text(text + '\n')
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add styles.css
          git commit -m "Preserve New Project north-star typography"
          git push origin HEAD:sol/fire-design-system-foundation
