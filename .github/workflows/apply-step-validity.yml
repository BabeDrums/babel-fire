name: Apply final Step validity cleanup

on:
  push:
    branches: [sol/steps-navigation-handoff]
    paths:
      - scripts/fix_step_validity.py
      - .github/workflows/apply-step-validity.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/steps-navigation-handoff
          fetch-depth: 0
      - name: Apply validity cleanup
        run: python3 scripts/fix_step_validity.py
      - name: Remove one-shot helpers
        run: rm scripts/fix_step_validity.py .github/workflows/apply-step-validity.yml
      - name: Validate patched files
        run: |
          node --check app.js
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align Step states with canonical prerequisites"
          git push origin HEAD:sol/steps-navigation-handoff
