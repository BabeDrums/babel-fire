name: Apply Chunk 2A workflow shell

on:
  push:
    branches:
      - sol/chunk2a-workflow-shell

permissions:
  contents: write

jobs:
  patch:
    if: "${{ !contains(github.event.head_commit.message, 'Apply Chunk 2A shell') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/chunk2a-workflow-shell
      - name: Apply workflow shell continuity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('app.js')
          text = app_path.read_text()

          topbar_pattern = r'(  function topbar\(left = "", center = "", right = ""\) \{.*?\n  \}\n)'
          helper = r'''
  function workflowHeading(title, subtitle = "", status = "") {
    return `<header class="page-heading"><h1>${esc(title)}</h1>${subtitle ? `<p class="sub">${esc(subtitle)}</p>` : ""}${status ? `<div class="workflow-position">${esc(status)}</div>` : ""}</header>`;
  }
  function workflowPage(title, subtitle, body, status = "") {
    return `<main class="workflow-page">${workflowHeading(title, subtitle, status)}${body}</main>`;
  }
  function workflowPhaseHome(index, done, total, checkpointsHtml, beforeHtml = "") {
    const p = project(),
      pct = total ? Math.round((done / total) * 100) : 0,
      body = `<div class="phase-layout ${beforeHtml ? "with-setup" : ""}">${beforeHtml ? `<section class="phase-setup">${beforeHtml}</section>` : ""}<section class="phase-checkpoints"><div class="checkpoint-head"><div class="section-kicker">Checkpoints</div><span class="checkpoint-count">${done} of ${total}</span></div><div class="progress checkpoint-progress"><span style="width:${pct}%"></span></div><div class="group-card list">${checkpointsHtml}</div></section></div>`;
    return (
      topbar(
        backButton("project", p?.title || "Project"),
        "",
        savedMark(),
      ) + workflowPage(STUDY_PHASES[index].title, STUDY_PHASES[index].desc, body)
    );
  }
'''
          text, n = re.subn(topbar_pattern, lambda m: m.group(1) + helper, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'topbar helper insertion count={n}')

          project_fn = r'''  function renderProject() {
    const p = project();
    if (!p) return go("projects", {}, false);
    if (p.type === "original") return renderOriginalOverview();
    const phaseIndex = currentStudyPhaseIndex(p),
      phase = STUDY_PHASES[phaseIndex],
      next = STUDY_PHASES[phaseIndex + 1],
      context = [p.artist, "Recreation"].filter(Boolean).join(" · ");
    const body = `<div class="project-overview"><section class="project-current"><div class="hero-card"><div class="phase-line"><div><div class="eyebrow" style="margin:0 0 6px">Current Phase</div><h3>${esc(phase.title)}</h3></div><div class="phase-num">Phase ${phaseIndex + 1} of 7</div></div><p class="sub">${esc(phase.desc)}</p>${progressBar(phaseIndex, 7).replace(/<div class="progress-meta">.*?<\/div>/, "")}<div class="spacer-18"></div><button class="primary full" data-action="go" data-route="${phase.route}">${phaseIndex === 0 ? (mapCheckpointCount(p) ? "Continue The Map" : "Start The Map") : phaseIndex === 1 ? (skeletonCheckpointCount(p) ? "Continue The Skeleton" : "Start The Skeleton") : "View Roadmap"}</button></div></section><section class="project-support">${next ? `<div class="section-kicker">Next</div><div class="group-card list"><div class="list-row static no-status"><div><div class="title">${esc(next.title)}</div><div class="desc">${esc(next.desc)}</div></div></div></div>` : ""}<div class="section-kicker">Project</div><div class="quick-grid"><button class="quick-card" data-action="go" data-route="roadmap"><strong>Roadmap</strong><span>Seven phases to a finished rebuild.</span></button><button class="quick-card" data-action="go" data-route="notes"><strong>Notes</strong><span>Questions and takeaways.</span></button></div></section></div>`;
    app.innerHTML =
      topbar(
        backButton("projects", "Projects"),
        "",
        `<button class="text-btn" data-action="settings" aria-label="Project options">…</button>`,
      ) + workflowPage(p.title, context, body);
  }
'''
          text, n = re.subn(r'  function renderProject\(\) \{.*?\n  \}\n(?=  function renderOriginalOverview\(\))', lambda m: project_fn, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'renderProject replacement count={n}')

          original_fn = r'''  function renderOriginalOverview() {
    const p = project(),
      done = originalSparkDone(p),
      context = [p.artist, "Original"].filter(Boolean).join(" · ");
    const body = `<div class="hero-card"><div class="phase-line"><div><div class="eyebrow" style="margin:0 0 6px">Current Phase</div><h3>The Spark</h3></div><div class="phase-num">Phase 1 of 7</div></div><p class="sub">Capture the thing worth making before you overthink it.</p>${progressBar(done ? 1 : 0, 1)}<div class="spacer-18"></div><button class="primary full" data-action="go" data-route="original-spark">${done ? "Open The Spark" : "Start The Spark"}</button></div>`;
    app.innerHTML =
      topbar(
        backButton("projects", "Projects"),
        "",
        `<button class="text-btn" data-action="settings" aria-label="Project options">…</button>`,
      ) + workflowPage(p.title, context, body);
  }
'''
          text, n = re.subn(r'  function renderOriginalOverview\(\) \{.*?\n  \}\n(?=  function renderNewProject\(\))', lambda m: original_fn, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'renderOriginalOverview replacement count={n}')

          old_map = '    app.innerHTML = phaseHome(0, done, 3, checkpoints, setup);'
          if text.count(old_map) != 1:
              raise SystemExit(f'map phaseHome call count={text.count(old_map)}')
          text = text.replace(old_map, '    app.innerHTML = workflowPhaseHome(0, done, 3, checkpoints, setup);', 1)

          structure_fn = r'''  function renderStructure() {
    const p = project(),
      labels = sectionLabels(p),
      done = structureDone(p);
    const body = `<div class="section-kicker">Structure</div><div class="structure-list" id="sortList">${
        sections(p).length
          ? sections(p)
              .map(
                (s, i) =>
                  `<div class="structure-row sort-row" role="button" tabindex="0" data-action="edit-section" data-section-id="${s.id}"><div class="index">${i + 1}</div><div class="name">${esc(labels[i])}</div><span class="bars-badge">${s.lengthBars} bars</span><button class="delete-section" data-action="delete-section" data-id="${s.id}" aria-label="Delete ${esc(labels[i])}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 10v7M14 10v7"/></svg></button><div class="drag-handle" data-drag-handle role="button" tabindex="0" aria-label="Reorder ${esc(labels[i])}">≡</div></div>`,
              )
              .join("")
          : `<div class="empty">No sections yet.</div>`
      }</div><button class="add-section-row" data-action="open-add-section">+ Add section</button><div class="section-kicker">Verify</div>${actionCard("Verify structure", "Confirm the order, lengths, and boundaries.", p.map.structureVerified, "toggle-structure-verified", !lengthsComplete(p))}<div class="spacer-24"></div><button class="primary full" data-action="go" data-route="tracks" ${done ? "" : "disabled"}>Next</button>`;
    app.innerHTML =
      topbar(historyBackButton("map", "The Map"), "", savedMark()) +
      workflowPage("Structure", "Build the song one section at a time.", body, "1 of 3");
    installSorting();
  }
'''
          text, n = re.subn(r'  function renderStructure\(\) \{.*?\n  \}\n(?=  function renderTracks\(\))', lambda m: structure_fn, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'renderStructure replacement count={n}')

          tracks_fn = r'''  function renderTracks() {
    const p = project(),
      selectedNames = new Set(tracks(p).map((t) => t.name)),
      custom = tracks(p).filter((t) => !COMMON_TRACKS.includes(t.name)),
      choices = [...COMMON_TRACKS, ...custom.map((t) => t.name)];
    const body = `<div class="section-kicker">Tracks</div><div class="choice-wrap">${choices.map((name) => `<button class="choice ${selectedNames.has(name) ? "selected" : ""}" data-action="toggle-track-choice" data-name="${esc(name)}" aria-pressed="${selectedNames.has(name)}">${esc(name)}</button>`).join("")}</div><div class="inline-add"><input aria-label="Custom track name" class="field" id="customTrack" placeholder="Other..."><button class="secondary" data-action="add-custom-track">Add</button></div><div class="spacer-24"></div><button class="primary full" data-action="start-section-study" ${tracksDone(p) ? "" : "disabled"}>Next</button>`;
    app.innerHTML =
      topbar(historyBackButton("structure", "Structure"), "", savedMark()) +
      workflowPage("Tracks", "Select everything that appears somewhere in the song.", body, "2 of 3");
  }
'''
          text, n = re.subn(r'  function renderTracks\(\) \{.*?\n  \}\n(?=\n  function rulerHtml\()', lambda m: tracks_fn, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'renderTracks replacement count={n}')

          app_path.write_text(text)

          styles_path = Path('styles.css')
          css = styles_path.read_text()
          old = '''.project-page {
  min-width: 0;
}
.project-page .page-heading {
  margin: 0 0 var(--space-5);
}
.project-page .page-heading h1 {
  margin: 0 0 7px;
}
'''
          new = '''.project-page,
.workflow-page {
  min-width: 0;
}
.workflow-page {
  width: 100%;
}
.project-page .page-heading,
.workflow-page .page-heading {
  margin: 0 0 var(--space-5);
}
.project-page .page-heading h1,
.workflow-page .page-heading h1 {
  margin: 0 0 7px;
}
.workflow-position {
  margin-top: 9px;
  color: var(--quiet);
  font-size: 12px;
  line-height: 1.4;
  font-variant-numeric: tabular-nums;
}
.workflow-page > .page-heading + .section-kicker,
.workflow-page .phase-setup > .section-kicker:first-child,
.workflow-page .phase-checkpoints > .checkpoint-head:first-child {
  margin-top: 0;
}
'''
          if css.count(old) != 1:
              raise SystemExit(f'workflow CSS anchor count={css.count(old)}')
          css = css.replace(old, new, 1)
          css = css.replace('''  .project-page .page-heading {
    margin-bottom: 20px;
  }
  .project-page .page-heading h1 {
    font-size: 34px;
    line-height: 1.04;
  }
''', '''  .project-page .page-heading,
  .workflow-page .page-heading {
    margin-bottom: 20px;
  }
  .project-page .page-heading h1,
  .workflow-page .page-heading h1 {
    font-size: 34px;
    line-height: 1.04;
  }
''', 1)
          styles_path.write_text(css)

          tests_path = Path('tests/test_v6.py')
          tests = tests_path.read_text()
          for title in ['Tracks', 'Structure', 'The Map']:
              tests = tests.replace(
                  f"expect(self.page.locator('h2')).to_have_text('{title}')",
                  f"expect(self.page.locator('h1')).to_have_text('{title}')",
              )
          tests = tests.replace("('map','.phase-pill'),('map','.state-control')", "('map','.nav-btn'),('map','.state-control')")
          old_parent = """        self.page.locator('.phase-pill').click();expect(self.page.locator('h1')).to_have_text('The Map')
        self.page.locator('.phase-pill').click();expect(self.page.locator('h1')).to_have_text('Migration song')
"""
          new_parent = """        self.page.locator('.phase-pill').click();expect(self.page.locator('h1')).to_have_text('The Map')
        self.assertEqual(self.page.locator('.phase-pill').count(),0)
        self.click('go','[data-route=\"project\"]');expect(self.page.locator('h1')).to_have_text('Migration song')
"""
          if tests.count(old_parent) != 1:
              raise SystemExit(f'parent nav test anchor count={tests.count(old_parent)}')
          tests = tests.replace(old_parent, new_parent, 1)

          insertion = r'''
    def test_workflow_shell_continuity_project_map_structure_tracks(self):
        self.open('project',width=820)
        cases=[
            ('project','Migration song','Test artist · Recreation','Projects',''),
            ('map','The Map','Understand the song before rebuilding it.','Migration song',''),
            ('structure','Structure','Build the song one section at a time.','The Map','1 of 3'),
            ('tracks','Tracks','Select everything that appears somewhere in the song.','Structure','2 of 3'),
        ]
        anchor=None
        for route,title,subtitle,back,status in cases:
            with self.subTest(route=route):
                self.canvas_route(route)
                self.assertEqual(self.page.locator('.workflow-page').count(),1)
                self.assertEqual(self.page.locator('.topbar .center').inner_text(),'')
                self.assertEqual(self.page.locator('.phase-pill').count(),0)
                expect(self.page.locator('.workflow-page .page-heading h1')).to_have_text(title)
                expect(self.page.locator('.workflow-page .page-heading .sub')).to_have_text(subtitle)
                expect(self.page.locator('.topbar .left')).to_contain_text(back)
                if status:
                    expect(self.page.locator('.workflow-position')).to_have_text(status)
                else:
                    self.assertEqual(self.page.locator('.workflow-position').count(),0)
                box=self.page.locator('.workflow-page .page-heading h1').bounding_box()
                if anchor is None:
                    anchor=(box['x'],box['y'])
                else:
                    self.assertLessEqual(abs(box['x']-anchor[0]),1)
                    self.assertLessEqual(abs(box['y']-anchor[1]),1)

'''
          marker = "\n\nif __name__ == '__main__':\n"
          if tests.count(marker) != 1:
              raise SystemExit('test file end marker missing')
          tests = tests.replace(marker, '\n' + insertion + marker, 1)
          tests_path.write_text(tests)
          PY
      - name: Verify syntax and patch hygiene
        run: |
          node --check app.js
          python -m py_compile tests/test_v6.py
          git diff --check
          git diff -- app.js styles.css tests/test_v6.py
      - name: Commit patch
        run: |
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add app.js styles.css tests/test_v6.py
          git commit -m "Apply Chunk 2A shell"
          git push origin HEAD:sol/chunk2a-workflow-shell
