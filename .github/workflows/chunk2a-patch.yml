name: Apply Chunk 2A workflow shell

on:
  push:
    branches:
      - sol/chunk2a-workflow-shell

permissions:
  contents: write

jobs:
  patch:
    if: "${{ !contains(github.event.head_commit.message, 'Apply Chunk 2A shell') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/chunk2a-workflow-shell
      - name: Apply workflow shell continuity
        run: python .github/chunk2a_patch.py
      - name: Verify syntax and patch hygiene
        run: |
          node --check app.js
          python -m py_compile tests/test_v6.py
          git diff --check
          git diff -- app.js styles.css tests/test_v6.py
      - name: Commit patch
        run: |
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add app.js styles.css tests/test_v6.py
          git commit -m "Apply Chunk 2A shell"
          git push origin HEAD:sol/chunk2a-workflow-shell
