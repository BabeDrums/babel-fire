name: Apply FIRE Chunk 1.1 test fix

on:
  push:
    branches:
      - sol/chunk1-1-apple-refinement

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply Chunk 1.1 desktop acceptance fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/chunk1-1-apple-refinement
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact test correction
        run: python scripts/chunk11_testfix.py
      - name: Validate
        run: |
          python -m py_compile tests/test_v6.py
          git diff --check
      - name: Commit correction
        run: |
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add tests/test_v6.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Chunk 1.1 desktop content-guide assertion"
          git push origin HEAD:sol/chunk1-1-apple-refinement
