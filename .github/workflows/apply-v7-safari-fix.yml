name: Apply V7 Safari correction
on:
  push:
    branches:
      - sol/v7-safari-stability-setup-semantics
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v7-safari-stability-setup-semantics
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply asserted patch
        run: python .github/scripts/apply_v7_safari_fix.py
      - name: Validate syntax and patch intent
        run: |
          node --check v7-preview/app.js
          python -m py_compile tests/test_v7_preview.py
          git diff --check
          ! grep -R "referenceFileInput\|visualViewport\|queueViewportFit\|data-v7-fit" v7-preview
      - name: Remove one-shot helper
        run: rm .github/scripts/apply_v7_safari_fix.py .github/workflows/apply-v7-safari-fix.yml
      - name: Commit corrected V7 behavior
        run: |
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize V7 Safari scrolling and setup semantics"
          git push origin HEAD:sol/v7-safari-stability-setup-semantics
