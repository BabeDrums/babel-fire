name: Fix design system regressions

on:
  push:
    branches:
      - sol/fire-design-system-foundation
    paths:
      - scripts/fix_design_system_regressions.py
      - .github/workflows/fix-design-system-regressions.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/fire-design-system-foundation
      - name: Apply fixes
        run: |
          python3 scripts/fix_design_system_regressions.py
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add styles.css tests/test_v6.py
          git commit -m "Fix design system regressions"
          git push origin HEAD:sol/fire-design-system-foundation
