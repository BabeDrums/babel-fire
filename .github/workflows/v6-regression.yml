name: FIRE regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          if [ -f v7-preview/app.js ]; then
            node --check v7-preview/app.js
            node --check v7-preview/model.js
          fi
          if [ -f v7-preview/shell-test.js ]; then
            node --check v7-preview/shell-test.js
          fi
          if [ -f v7-preview/new-project.js ]; then
            node --check v7-preview/new-project.js
          fi
      - name: Check whitespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          else
            git diff --check HEAD^
          fi

  handoff:
    name: Authority + handoff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require current authority and zero-context handoff
        run: >-
          python3 scripts/check_handoff.py
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.sha }}"

  browser:
    name: Chromium regression (${{ matrix.width }}px)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        width: [390, 440, 820]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Prepare local Pages metadata
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          revision = os.environ['GITHUB_SHA']
          Path('build-info.json').write_text(json.dumps({'commit': revision}), encoding='utf-8')
          for html_path in ('index.html', 'v7-preview/index.html', 'v7-preview/shell-test.html'):
              path = Path(html_path)
              text = path.read_text(encoding='utf-8').replace('{{ site.github.build_revision }}', revision)
              if text.startswith('---\n---\n'):
                  text = text[8:]
              path.write_text(text, encoding='utf-8')
          PY
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Resolve Chromium path
        run: |
          echo "CHROMIUM_PATH=$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          p = sync_playwright().start()
          print(p.chromium.executable_path)
          p.stop()
          PY
          )" >> "$GITHUB_ENV"
      - name: Start FIRE static server
        run: |
          python -m http.server 8000 > /tmp/fire-http.log 2>&1 &
          echo $! > /tmp/fire-http.pid
          for i in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/fire-http.log
          exit 1
      - name: Run browser regressions
        env:
          FIRE_URL: http://127.0.0.1:8000
          FIRE_TEST_WIDTH: ${{ matrix.width }}
        run: python -B -m unittest discover -s tests -v
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/fire-http.log || true
