name: Cleanup project and Map refinement

on:
  push:
    branches:
      - sol/project-map-notes-foundation

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/project-map-notes-foundation
      - name: Check generated cleanup commit
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[auto-clean\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Normalize files
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('V6.md')
          path.write_text(path.read_text().rstrip() + '\n')
          app = Path('app.js')
          text = app.read_text()
          text = text.replace('          expandedTrackId: null,\n                animating: false,\n', '          expandedTrackId: null,\n          animating: false,\n')
          app.write_text(text)
          PY
          git diff --check
          node --check app.js
      - name: Commit cleanup
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add V6.md app.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize project refinement files [auto-clean]"
          git push origin HEAD:sol/project-map-notes-foundation
