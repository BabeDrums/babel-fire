name: Apply FIRE design system foundation

on:
  push:
    branches:
      - sol/fire-design-system-foundation
    paths:
      - scripts/apply_fire_design_system_foundation.py
      - .github/workflows/apply-fire-design-system-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/fire-design-system-foundation
      - name: Apply foundation patch
        run: python3 scripts/apply_fire_design_system_foundation.py
      - name: Commit foundation
        run: |
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add app.js styles.css tests/test_v6.py START_HERE.md CHANGELOG.md
          git diff --cached --check
          git commit -m "Apply FIRE design system foundation"
          git push origin HEAD:sol/fire-design-system-foundation
