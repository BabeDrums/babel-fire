name: Apply stable Map Step fix

on:
  push:
    branches:
      - sol/steps-navigation-handoff
    paths:
      - .github/workflows/apply-map-step-node-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/steps-navigation-handoff
      - name: Patch Map Step updates in place
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'  // Live Setup updates replace only derived Step navigation, preserving text/caret/IME\.\n'
              r'  function refreshMapProgress\(\) \{\n.*?\n  \}\n  let cancelGesture',
              re.S,
          )
          replacement = '''  // Live Setup updates patch existing Step rows in place so text/caret/IME
          // and a pointer gesture already aimed at a row remain stable.
          function refreshMapProgress() {
            const p = project(),
              holder = app.querySelector(".phase-steps .group-card"),
              count = app.querySelector(".step-count"),
              done = mapStepCount(p);
            if (count) count.textContent = `${done} of 3 complete`;
            if (holder) {
              phaseStepDefinitions(p, 0).forEach((step) => {
                const row = holder.querySelector(`.step-row[data-route="${step.route}"]`);
                if (!row) return;
                const state = stepState(step),
                  stateLabel =
                    state === "done" ? "Done" : state === "current" ? "Current" : "Locked",
                  trailing = row.querySelector(".step-trailing"),
                  label = row.querySelector(".step-state");
                row.classList.remove("done", "current", "locked");
                row.classList.add(state);
                row.disabled = state === "locked";
                row.setAttribute("aria-label", `${step.title}, ${stateLabel}`);
                if (label) label.textContent = stateLabel;
                const chev = trailing?.querySelector(".chev");
                if (state === "locked") {
                  chev?.remove();
                } else if (trailing && !chev) {
                  trailing.insertAdjacentHTML(
                    "beforeend",
                    '<span class="chev" aria-hidden="true">›</span>',
                  );
                }
              });
            }
            queueViewportFit();
          }
          let cancelGesture'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one refreshMapProgress block, replaced {count}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate patch
        run: |
          node --check app.js
          grep -q 'phaseStepDefinitions(p, 0).forEach' app.js
          ! grep -q 'holder.innerHTML = phaseStepsHtml(p, 0)' app.js
      - name: Remove one-shot helper and commit
        run: |
          rm .github/workflows/apply-map-step-node-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/apply-map-step-node-fix.yml
          git commit -m "Keep Map Step rows stable during setup edits"
          git push origin HEAD:sol/steps-navigation-handoff
