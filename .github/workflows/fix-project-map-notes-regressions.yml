name: Fix project and Map regressions

on:
  push:
    branches:
      - sol/project-map-notes-foundation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/project-map-notes-foundation
      - name: Check generated fix commit
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[auto-regression-fix\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply regression fixes
        if: steps.guard.outputs.skip != 'true'
        run: python3 scripts/fix_project_map_notes_regressions_v2.py
      - name: Validate source
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          node --check app.js
          git diff --check
          python3 -m py_compile tests/test_adaptive_composition.py tests/test_declutter.py tests/test_design_system.py tests/test_v6.py
      - name: Commit fixes
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add app.js tests/test_adaptive_composition.py tests/test_declutter.py tests/test_design_system.py tests/test_v6.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Align regressions with stable project and Map design [auto-regression-fix]"
          git push origin HEAD:sol/project-map-notes-foundation
