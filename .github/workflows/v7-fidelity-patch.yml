name: V7 fidelity one-shot patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'v7-interaction-fidelity-grayscale'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v7-interaction-fidelity-grayscale
          fetch-depth: 0
      - name: Apply asserted patch
        run: python .tmp/v7_fidelity_patch.py
      - name: Static validation
        run: |
          node --check v7-preview/app.js
          python -m py_compile tests/test_v7_preview.py
          git diff --check
      - name: Commit clean branch state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .tmp/v7_fidelity_patch.py .github/workflows/v7-fidelity-patch.yml
          git add v7-preview/app.js v7-preview/styles.css tests/test_v7_preview.py V7_DRAFT.md START_HERE.md
          git diff --cached --check
          git commit -m "Refine V7 grayscale interaction fidelity"
          git push origin HEAD:v7-interaction-fidelity-grayscale
