name: Apply live BPM regression update

on:
  push:
    branches: [sol/current-task-declutter]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/current-task-declutter
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update live BPM regression expectations
        run: python scripts/patch_live_bpm_test.py
      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_v6.py
          git rm scripts/patch_live_bpm_test.py .github/workflows/apply-live-bpm-test.yml
          git diff --cached --check
          git commit -m "Align live BPM regression with prerequisite summary"
          git push origin HEAD:sol/current-task-declutter
