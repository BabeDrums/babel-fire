name: Apply live checkpoint summary fix

on:
  push:
    branches: [sol/current-task-declutter]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/current-task-declutter
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply live checkpoint summary fix
        run: python scripts/patch_live_checkpoint_summary.py
      - name: Validate and commit
        run: |
          node --check app.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git rm scripts/patch_live_checkpoint_summary.py .github/workflows/apply-live-checkpoint-summary.yml
          git diff --cached --check
          git commit -m "Keep Map prerequisite summary live while editing"
          git push origin HEAD:sol/current-task-declutter
