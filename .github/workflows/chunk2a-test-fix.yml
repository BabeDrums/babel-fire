name: Fix Chunk 2A regression assertions

on:
  push:
    branches:
      - sol/chunk2a-workflow-shell

permissions:
  contents: write

jobs:
  fix:
    if: "${{ !contains(github.event.head_commit.message, 'Fix Chunk 2A assertions') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/chunk2a-workflow-shell
      - name: Fix assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_v6.py')
          s=p.read_text()
          old="""        self.assertEqual(self.page.locator('.phase-pill').count(),0)\n        self.click('go','[data-route=\"project\"]');expect(self.page.locator('h1')).to_have_text('Migration song')\n"""
          new="""        self.assertEqual(self.page.locator('.phase-pill').count(),0)\n        self.canvas_route('project');expect(self.page.locator('h1')).to_have_text('Migration song')\n"""
          if s.count(old)!=1: raise SystemExit('parent assertion anchor mismatch')
          s=s.replace(old,new,1)
          s=s.replace("('project','Migration song','Test artist · Recreation','Projects',''),", "('project','Migration song','Test artist · Recreation','projects',''),",1)
          s=s.replace("('map','The Map','Understand the song before rebuilding it.','Migration song',''),", "('map','The Map','Understand the song before rebuilding it.','project',''),",1)
          s=s.replace("('structure','Structure','Build the song one section at a time.','The Map','1 of 3'),", "('structure','Structure','Build the song one section at a time.','map','1 of 3'),",1)
          s=s.replace("('tracks','Tracks','Select everything that appears somewhere in the song.','Structure','2 of 3'),", "('tracks','Tracks','Select everything that appears somewhere in the song.','structure','2 of 3'),",1)
          old2="""                expect(self.page.locator('.topbar .left')).to_contain_text(back)\n"""
          new2="""                back_button=self.page.locator('.topbar > .left > .nav-btn')\n                self.assertEqual(back_button.count(),1)\n                self.assertEqual(back_button.get_attribute('data-fallback-route'),back)\n"""
          if s.count(old2)!=1: raise SystemExit('shell back assertion anchor mismatch')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          python -m py_compile tests/test_v6.py
          git diff --check
      - name: Commit
        run: |
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add tests/test_v6.py
          git commit -m "Fix Chunk 2A assertions"
          git push origin HEAD:sol/chunk2a-workflow-shell
