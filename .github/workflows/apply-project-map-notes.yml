name: Apply project and Map refinement

on:
  push:
    branches:
      - sol/project-map-notes-foundation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/project-map-notes-foundation

      - name: Check whether this is the generated commit
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[auto-refine\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply refinement
        if: steps.guard.outputs.skip != 'true'
        run: python3 scripts/apply_project_map_notes.py

      - name: Check JavaScript syntax
        if: steps.guard.outputs.skip != 'true'
        run: node --check app.js

      - name: Commit refinement
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add app.js styles.css tests/test_v6.py START_HERE.md V6.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Project actions, notes foundation, and stable Song Setup [auto-refine]"
          git push origin HEAD:sol/project-map-notes-foundation
