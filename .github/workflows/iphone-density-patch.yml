name: FIRE iPhone density patch

on:
  push:
    branches: [sol/iphone-scroll-density-pass]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/iphone-scroll-density-pass
          fetch-depth: 0
      - name: Apply iPhone viewport and density corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('styles.css')
          text = path.read_text(encoding='utf-8')

          old = '''html {
            background: var(--bg);
          }
          body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);'''
          new = '''html {
            background: var(--bg);
            overscroll-behavior-y: none;
          }
          body {
            margin: 0;
            min-height: 100dvh;
            background: var(--bg);
            overscroll-behavior-y: none;'''
          if old not in text:
              raise SystemExit('root viewport block not found')
          text = text.replace(old, new, 1)

          old = '''.app-shell {
            max-width: var(--canvas-width);
            margin: 0 auto;
            min-height: 100vh;'''
          new = '''.app-shell {
            max-width: var(--canvas-width);
            margin: 0 auto;
            min-height: 100dvh;'''
          if old not in text:
              raise SystemExit('app shell viewport block not found')
          text = text.replace(old, new, 1)

          old = '''  .project-open {
            padding-left: 16px;
            min-height: 102px;
          }
        }'''
          new = '''  .project-open {
            padding-left: 16px;
            min-height: 102px;
          }

          /* Phone screens keep one stable top alignment; density changes only when content needs it. */
          #app[data-route="map"] .setup-row {
            min-height: 56px;
            padding-inline: 14px;
          }
          #app[data-route="map"] .phase-setup > .spacer-18 {
            height: 10px;
          }
          #app[data-route="map"] .phase-setup .action-card {
            min-height: 58px;
          }
          #app[data-route="map"] .phase-checkpoints .list-row {
            min-height: 54px;
            padding-top: 8px;
            padding-bottom: 8px;
          }
          #app[data-route="map"] .phase-checkpoints .list-row .desc {
            display: none;
          }
          #app[data-route="map"] .checkpoint-progress {
            margin-bottom: 8px;
          }

          #app[data-route="roadmap"] > .spacer-18 {
            height: 12px;
          }
          #app[data-route="roadmap"] .road-phase {
            padding: 11px 14px;
          }
          #app[data-route="roadmap"] .road-top {
            grid-template-columns: 28px minmax(0, 1fr) auto;
            gap: 10px;
          }
          #app[data-route="roadmap"] .road-phase:not(.current) .road-top p,
          #app[data-route="roadmap"] .road-phase:not(.current) .road-checks {
            display: none;
          }
          #app[data-route="roadmap"] .road-phase:not(.current) .micro {
            display: block;
            margin-top: 2px;
          }
          #app[data-route="roadmap"] .road-phase.current .road-checks {
            margin-top: 5px;
            margin-left: 38px;
          }

          .section-builder {
            padding-top: 18px;
          }
          .section-builder .grabber {
            margin-bottom: 12px;
          }
          .section-builder .section-kicker {
            margin-top: 18px;
            margin-bottom: 8px;
          }
          .section-builder .choice-wrap {
            gap: 6px;
            grid-auto-rows: minmax(44px, auto);
          }
          .section-builder .choice {
            min-height: 44px;
            padding: 8px 6px;
          }
          .section-builder .builder-status:empty,
          .section-builder .sheet-error:empty {
            min-height: 0;
            margin-top: 0;
          }
          .section-builder .sheet-actions {
            margin-top: 10px;
            gap: 4px;
          }
        }'''
          if old not in text:
              raise SystemExit('phone media block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate focused source checks
        run: |
          git diff --check
          python -B -m unittest tests.test_design_system -v
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Tighten iPhone scroll and density behavior"
          git push origin HEAD:sol/iphone-scroll-density-pass
