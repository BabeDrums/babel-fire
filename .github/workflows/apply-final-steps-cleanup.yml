name: Apply final Steps cleanup

on:
  push:
    branches: [sol/steps-navigation-handoff]
    paths:
      - scripts/final_steps_cleanup.py
      - .github/workflows/apply-final-steps-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/steps-navigation-handoff
          fetch-depth: 0
      - name: Apply final cleanup
        run: python3 scripts/final_steps_cleanup.py
      - name: Remove one-shot helpers
        run: rm scripts/final_steps_cleanup.py .github/workflows/apply-final-steps-cleanup.yml
      - name: Validate patched files
        run: |
          node --check app.js
          python3 -m py_compile tests/test_design_system.py
          git diff --check
      - name: Commit final cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish FIRE Steps navigation cleanup"
          git push origin HEAD:sol/steps-navigation-handoff
