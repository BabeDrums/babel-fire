name: Fix V7 Later wording once

on:
  push:
    branches: [sol/v7-visual-semantics-composition]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v7-visual-semantics-composition
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile wording
        run: python3 scripts/fix_v7_later_once.py
      - name: Check whitespace
        run: git diff --check
      - name: Commit wording fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reconcile V7 future-phase wording'
          git push origin HEAD:sol/v7-visual-semantics-composition
