name: Fix stale V7 Review Map test
on:
  push:
    branches:
      - sol/v7-safari-stability-setup-semantics
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v7-safari-stability-setup-semantics
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix stale assertion
        run: python .github/scripts/fix_v7_review_map_test.py
      - name: Validate
        run: |
          python -m py_compile tests/test_v7_preview.py
          git diff --check
      - name: Remove one-shot helper
        run: rm .github/scripts/fix_v7_review_map_test.py .github/workflows/fix-v7-review-map-test.yml
      - name: Commit fix
        run: |
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add -A
          git commit -m "Update V7 Review Map regression copy"
          git push origin HEAD:sol/v7-safari-stability-setup-semantics
