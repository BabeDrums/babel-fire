name: Apply project fields cleanup

on:
  push:
    branches:
      - sol/chunk1-project-fields-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply project fields cleanup') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/chunk1-project-fields-cleanup
      - name: Apply focused patch
        run: python scripts/project_fields_cleanup.py
      - name: Verify syntax and whitespace
        run: |
          node --check app.js
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add app.js tests/test_v6.py
          git commit -m "Apply project fields cleanup"
          git push origin HEAD:sol/chunk1-project-fields-cleanup
