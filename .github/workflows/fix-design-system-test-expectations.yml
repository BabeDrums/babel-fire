name: Fix design system test expectations

on:
  push:
    branches:
      - sol/fire-design-system-foundation
    paths:
      - scripts/fix_design_system_test_expectations.py
      - .github/workflows/fix-design-system-test-expectations.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/fire-design-system-foundation
      - name: Apply test fixes
        run: |
          python3 scripts/fix_design_system_test_expectations.py
          git diff --check
      - name: Commit fixes
        run: |
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add tests/test_v6.py
          git commit -m "Align design system regressions with intended geometry"
          git push origin HEAD:sol/fire-design-system-foundation
