name: Apply V7 semantics once

on:
  push:
    branches: [sol/v7-visual-semantics-composition]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/v7-visual-semantics-composition
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply asserted patch
        run: python3 scripts/apply_v7_semantics_once.py
      - name: Static checks
        run: |
          node --check v7-preview/app.js
          python3 -m py_compile tests/test_v7_preview.py
          git diff --check
      - name: Commit generated pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply V7 visual semantics and composition'
          git push origin HEAD:sol/v7-visual-semantics-composition
