name: Apply fresh Artist input fix

on:
  push:
    branches:
      - sol/chunk1-fresh-artist-input

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply fresh Artist input fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/chunk1-fresh-artist-input
      - name: Apply focused patch
        run: python scripts/fresh_artist_input_fix.py
      - name: Verify syntax and whitespace
        run: |
          node --check app.js
          git diff --check
      - name: Commit fix
        run: |
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add app.js tests/test_v6.py
          git commit -m "Apply fresh Artist input fix"
          git push origin HEAD:sol/chunk1-fresh-artist-input
