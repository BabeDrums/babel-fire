name: Apply Structure polish pass
on:
  push:
    branches: [sol/chunk2b-structure-polish]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/chunk2b-structure-polish
      - name: Apply focused Structure changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'app.js',
              '<div class="section-kicker">Verify</div>${actionCard("Verify structure", "Confirm the order, lengths, and boundaries.", p.map.structureVerified, "toggle-structure-verified", !lengthsComplete(p))}<div class="spacer-24"></div><button class="primary full" data-action="go" data-route="tracks" ${done ? "" : "disabled"}>Next</button>',
              '<div class="section-kicker structure-ready-label">Ready?</div><div class="structure-verify">${actionCard("Verify structure", "Confirm the order, lengths, and boundaries.", p.map.structureVerified, "toggle-structure-verified", !lengthsComplete(p))}</div><div class="structure-next-wrap"><button class="primary structure-next" data-action="go" data-route="tracks" ${done ? "" : "disabled"}>Next</button></div>'
          )

          replace_once(
              'app.js',
              '<div class="structure-row sort-row" role="button" tabindex="0" data-action="edit-section" data-section-id="${s.id}">',
              '<div class="structure-row sort-row" role="button" tabindex="0" data-action="edit-section" data-section-id="${s.id}" aria-label="Edit ${esc(labels[i])}, ${s.lengthBars} bars">'
          )

          replace_once(
              'styles.css',
              '''.structure-list {
  display: grid;
  gap: 8px;
}
.structure-row {
  min-height: 66px;
  padding: 0 8px 0 12px;
  border-radius: var(--radius-control);
  border: 1px solid var(--line);
  background: var(--surface);
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr) auto 44px 44px;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  touch-action: pan-y;
}
.structure-row .index {
  font-size: 11px;
  color: var(--quiet);
  text-align: center;
}
.structure-row .name {
  font-size: 16px;
  font-weight: 680;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bars-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 54px;
  height: 30px;
  padding: 0 12px;
  border-radius: var(--radius-pill);
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
}
.add-section-row {
  width: 100%;
  min-height: 52px;
  margin-top: 8px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-control);
  color: var(--accent-text);
  font-weight: 680;
  cursor: pointer;
  background: rgba(201, 205, 213, 0.035);
}''',
              '''.structure-list {
  display: grid;
  gap: 6px;
}
.structure-row {
  min-height: 68px;
  padding: 0 6px 0 14px;
  border-radius: var(--radius-control);
  border: 1px solid var(--line);
  background: var(--surface);
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr) auto 44px 44px;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  touch-action: pan-y;
}
.structure-row .index {
  font-size: 11px;
  color: var(--quiet);
  text-align: left;
  font-variant-numeric: tabular-nums;
}
.structure-row .name {
  font-size: 16px;
  font-weight: 680;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bars-badge {
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  min-width: 52px;
  min-height: 30px;
  padding: 0 6px;
  border: 0;
  background: transparent;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.add-section-row {
  width: 100%;
  min-height: 50px;
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius-control);
  color: var(--accent-text);
  font-weight: 650;
  cursor: pointer;
  background: transparent;
}'''
          )

          replace_once(
              'styles.css',
              '''.delete-section {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  color: var(--muted);
}
.delete-section svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.delete-section:hover { color: var(--danger); }''',
              '''.delete-section {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  color: var(--quiet);
  border-radius: var(--radius-control);
}
.delete-section svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.delete-section:active { color: var(--danger); }
@media (hover: hover) and (pointer: fine) {
  .delete-section:hover { color: var(--danger); }
}'''
          )

          replace_once(
              'styles.css',
              '''.section-builder .choice-wrap {
  grid-auto-rows: minmax(48px, auto);
}''',
              '''.section-builder .choice-wrap {
  grid-auto-rows: minmax(48px, auto);
}
.section-builder .choice[aria-pressed]::before {
  content: "";
  display: none;
  width: 0;
  margin: 0;
}
.section-builder .choice.selected {
  background: var(--state-selected);
  border-color: var(--state-selected-border);
}
.builder-status {
  min-height: 20px;
  margin-top: 12px;
  color: var(--muted);
  font-size: 12px;
  line-height: 20px;
}
.structure-ready-label {
  margin-top: 30px;
}
.structure-verify .action-card {
  background: transparent;
}
.structure-next-wrap {
  display: flex;
  justify-content: flex-end;
  margin-top: 24px;
}
.structure-next {
  width: 100%;
  min-height: 48px;
}
@media (min-width: 640px) {
  .structure-next {
    width: 280px;
  }
}'''
          )

          marker = '''    def test_segment_selected_and_keyboard_focus_are_distinct_without_geometry_changes(self):\n'''
          addition = '''    def test_structure_polish_hierarchy_and_responsive_next(self):\n        for width in [390,820]:\n            with self.subTest(width=width):\n                self.open('structure',width=width,pointer=width>=820)\n                expect(self.page.locator('.structure-ready-label')).to_have_text('Ready?')\n                self.assertEqual(self.page.locator('[data-action="open-add-section"]').evaluate('el=>getComputedStyle(el).borderStyle'),'solid')\n                row=self.page.locator('.structure-row').first\n                self.assertGreaterEqual(row.bounding_box()['height'],68)\n                self.assertEqual(self.page.locator('.bars-badge').first.evaluate('el=>getComputedStyle(el).backgroundColor'),'rgba(0, 0, 0, 0)')\n                nxt=self.page.locator('[data-route="tracks"]');page=self.page.locator('.workflow-page')\n                if width>=640:\n                    self.assertLessEqual(nxt.bounding_box()['width'],280.5)\n                    self.assertAlmostEqual(nxt.bounding_box()['x']+nxt.bounding_box()['width'],page.bounding_box()['x']+page.bounding_box()['width'],delta=1)\n                else:\n                    self.assertAlmostEqual(nxt.bounding_box()['width'],page.bounding_box()['width'],delta=1)\n                self.click('open-add-section');self.click('choose-section-type','[data-name="Intro"]')\n                selected=self.page.locator('[data-action="choose-section-type"][data-name="Intro"]')\n                self.assertEqual(selected.evaluate("el=>getComputedStyle(el,'::before').display"),'none')\n                self.click('set-new-section-bars','[data-bars="8"]');self.click('save-new-section')\n                expect(self.page.locator('#builderStatus')).to_have_text('Added Intro · 8 bars')\n                expect(self.page.locator('[data-bars="8"]')).to_have_attribute('aria-pressed','true')\n                expect(self.page.locator('#sheetRoot')).to_have_attribute('aria-hidden','false')\n                self.context.close()\n\n'''
          p = Path('tests/test_v6.py')
          text = p.read_text()
          if text.count(marker) != 1:
              raise SystemExit('test marker mismatch')
          p.write_text(text.replace(marker, addition + marker, 1))
          PY
      - name: Commit Structure pass
        run: |
          rm .github/workflows/chunk2b-structure-patch.yml
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add app.js styles.css tests/test_v6.py .github/workflows/chunk2b-structure-patch.yml
          git commit -m "Polish Structure editing hierarchy"
          git push origin HEAD:sol/chunk2b-structure-polish
