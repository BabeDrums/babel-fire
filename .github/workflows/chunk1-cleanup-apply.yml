name: Apply FIRE Chunk 1 cleanup

on:
  push:
    branches:
      - sol/chunk1-cleanup

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add Chunk 1 cleanup apply workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/chunk1-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply cleanup patch
        run: python scripts/chunk1_cleanup.py
      - name: Validate patch
        run: |
          node --check app.js
          python -m py_compile tests/test_v6.py
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add app.js styles.css tests/test_v6.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish Chunk 1 Apple cleanup"
          git push origin HEAD:sol/chunk1-cleanup
