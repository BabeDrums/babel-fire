name: Apply current-task declutter

on:
  push:
    branches: [sol/current-task-declutter]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/current-task-declutter
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch current-task hierarchy
        run: python scripts/patch_current_task_declutter.py
      - name: Check syntax and commit final source
        run: |
          node --check app.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css START_HERE.md
          git rm scripts/patch_current_task_declutter.py .github/workflows/apply-current-task-declutter.yml
          git diff --cached --check
          git commit -m "Tighten current-task hierarchy"
          git push origin HEAD:sol/current-task-declutter
