name: Apply FIRE Core doctrine reconciliation

on:
  push:
    branches: [sol/fire-core-doctrine]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sol/fire-core-doctrine
      - name: Apply doctrine reconciliation
        run: python3 scripts/apply_fire_core_doctrine_v2.py
      - name: Validate doctrine guard
        run: python3 scripts/check_product_doctrine.py
      - name: Commit reconciled doctrine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile FIRE Core doctrine across project docs"
          git push origin HEAD:sol/fire-core-doctrine
