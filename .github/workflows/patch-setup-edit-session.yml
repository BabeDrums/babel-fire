name: Patch setup edit session

on:
  push:
    branches: [sol/adaptive-composition]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/adaptive-composition
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch setup edit-session behavior
        run: python scripts/patch_setup_edit_session.py
      - name: Check syntax and commit final source
        run: |
          node --check app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git rm scripts/patch_setup_edit_session.py .github/workflows/patch-setup-edit-session.yml
          git diff --cached --check
          git commit -m "Keep reopened Song Setup stable while editing"
          git push origin HEAD:sol/adaptive-composition
