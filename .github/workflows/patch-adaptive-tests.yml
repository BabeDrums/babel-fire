name: Patch adaptive regression assumptions

on:
  push:
    branches: [sol/adaptive-composition]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/adaptive-composition
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update regressions for adaptive disclosure
        run: python scripts/patch_adaptive_test_assumptions.py
      - name: Commit final test update and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_v6.py
          git rm scripts/patch_adaptive_test_assumptions.py .github/workflows/patch-adaptive-tests.yml
          git diff --cached --check
          git commit -m "Update regressions for adaptive Map disclosure"
          git push origin HEAD:sol/adaptive-composition
