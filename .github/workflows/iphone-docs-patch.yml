name: FIRE iPhone docs patch

on:
  push:
    branches:
      - "sol/iphone-scroll-density-pass"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/iphone-scroll-density-pass
          fetch-depth: 0
      - name: Apply continuity updates
        run: python .github/scripts/iphone_docs_patch.py
      - name: Validate patch
        run: git diff --check
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add START_HERE.md AGENTS.md V6.md CONTEXT.md CHANGELOG.md
          git commit -m "Document iPhone scroll and density rules"
          git push origin HEAD:sol/iphone-scroll-density-pass
