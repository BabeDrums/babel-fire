name: Apply approved Steps/navigation chunk

on:
  push:
    branches: [sol/steps-navigation-handoff]
    paths:
      - scripts/apply_steps_navigation.py
      - .github/workflows/apply-steps-navigation.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/steps-navigation-handoff
          fetch-depth: 0
      - name: Apply approved repository patch
        run: python3 scripts/apply_steps_navigation.py
      - name: Remove one-shot implementation helpers
        run: rm scripts/apply_steps_navigation.py .github/workflows/apply-steps-navigation.yml
      - name: Validate patched JavaScript and whitespace
        run: |
          node --check app.js
          git diff --check
      - name: Commit approved chunk
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate FIRE Steps navigation and handoff"
          git push origin HEAD:sol/steps-navigation-handoff
