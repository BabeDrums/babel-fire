name: Apply FIRE Chunk 1

on:
  push:
    branches:
      - sol/chunk1-foundation-projects

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/chunk1-foundation-projects
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact source edits
        run: python scripts/chunk1_patch.py
      - name: Validate source
        run: |
          node --check app.js
          python -m py_compile tests/test_v6.py
          git diff --check
      - name: Commit source edits
        run: |
          git config user.name "Babel"
          git config user.email "110964546+BabeDrums@users.noreply.github.com"
          git add app.js styles.css tests/test_v6.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build Chunk 1 foundation and Projects"
          git push origin HEAD:sol/chunk1-foundation-projects
