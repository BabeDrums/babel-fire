name: FIRE foundation follow-up patch

on:
  push:
    branches: [sol/fire-foundation-consolidation]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/fire-foundation-consolidation
          fetch-depth: 0
      - name: Apply focused follow-up corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('styles.css')
          text = path.read_text(encoding='utf-8')

          old = '''.topbar .center .phase-pill,
          .topbar .center .pill-tag {
            display: none;
          }'''
          new = '''.topbar .center .phase-pill {
            display: inline-flex;
            min-height: 44px;
            padding: 0 8px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: var(--muted);
            font-size: 14px;
            font-weight: 620;
          }
          .topbar .center .pill-tag {
            display: none;
          }'''
          if old not in text:
              raise SystemExit('center phase chrome block not found')
          text = text.replace(old, new, 1)

          old = '''.add-section-row {
            width: auto;
            min-height: 44px;
            margin-top: 8px;
            padding: 0 10px;
            border: 0;
            border-radius: var(--radius-control);
            color: var(--accent-text);
            font-weight: 650;
            cursor: pointer;
            background: transparent;
          }'''
          new = '''.add-section-row {
            width: 100%;
            min-height: 48px;
            margin-top: 8px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius-control);
            color: var(--muted);
            font-weight: 640;
            cursor: pointer;
            background: transparent;
          }'''
          if old not in text:
              raise SystemExit('add-section block not found')
          text = text.replace(old, new, 1)

          old = '''.structure-next {
            width: auto;
            min-width: 132px;
            max-width: var(--action-max);
            min-height: 48px;
          }'''
          new = '''.structure-next {
            width: 100%;
            min-width: 132px;
            max-width: none;
            min-height: 48px;
          }
          @media (min-width: 640px) {
            .structure-next {
              width: var(--action-max);
              max-width: var(--action-max);
            }
          }'''
          if old not in text:
              raise SystemExit('structure-next block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate patch
        run: |
          git diff --check
          python -B -m unittest tests.test_design_system -v
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Preserve parent navigation and responsive Structure actions"
          git push origin HEAD:sol/fire-foundation-consolidation
