name: Apply declutter regression fixes

on:
  push:
    branches: [sol/current-task-declutter]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sol/current-task-declutter
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply behavior and regression updates
        run: python scripts/patch_declutter_regressions.py
      - name: Validate and commit
        run: |
          node --check app.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/test_v6.py
          git rm scripts/patch_declutter_regressions.py .github/workflows/apply-declutter-regression-fixes.yml
          git diff --cached --check
          git commit -m "Align declutter interactions and regressions"
          git push origin HEAD:sol/current-task-declutter
